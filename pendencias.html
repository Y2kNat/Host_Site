<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostVille BOT - Pendências</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: rgba(255,255,255,0.03);
            --text: #ffffff;
            --text-dim: rgba(255,255,255,0.5);
            --border: rgba(255,255,255,0.06);
            --radius: 14px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#050505; color:#fff; font-family:'Inter',sans-serif;
            min-height:100vh; width:100vw; -webkit-font-smoothing:antialiased; overflow-x:hidden;
        }
        .stage { position:fixed; width:100%; height:100%; z-index:0; pointer-events:none; overflow:hidden; }
        .blob { position:absolute; border-radius:50%; filter:blur(60px); }
        .blob-1 { width:400px; height:400px; background:rgba(88,101,242,0.3); left:-5%; top:-10%; animation:float1 20s infinite; }
        .blob-2 { width:350px; height:350px; background:rgba(255,255,255,0.15); left:55%; top:-5%; animation:float2 25s infinite; }
        .blob-3 { width:500px; height:500px; background:rgba(88,101,242,0.2); left:25%; top:40%; animation:float3 30s infinite; }
        @keyframes float1{0%,100%{transform:translate(0,0)scale(1)}50%{transform:translate(-40px,80px)scale(0.9)}}
        @keyframes float2{0%,100%{transform:translate(0,0)scale(1)}50%{transform:translate(50px,-80px)scale(0.85)}}
        @keyframes float3{0%,100%{transform:translate(0,0)scale(1)}50%{transform:translate(-50px,-60px)scale(0.9)}}
        .container { position:relative; z-index:10; max-width:1400px; margin:0 auto; padding:24px; }
        .header { display:flex; align-items:center; gap:16px; margin-bottom:28px; padding-bottom:18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
        .back-btn { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); text-decoration:none; letter-spacing:2px; text-transform:uppercase; padding:8px 16px; border:1px solid rgba(255,255,255,0.1); border-radius:25px; }
        .back-btn:hover { color:#fff; border-color:rgba(255,255,255,0.3); }
        .header h1 { font-weight:800; font-size:clamp(1.3rem,4vw,2rem); letter-spacing:-1.5px; flex:1; }
        .header .brand-id { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--text-dim); display:block; margin-bottom:4px; }
        .header .role-badge { font-family:'Space Mono',monospace; font-size:8px; letter-spacing:3px; color:rgba(255,255,255,0.3); }
        .main-layout { display:flex; gap:16px; height:calc(100vh - 160px); min-height:500px; }
        
        .terminal-panel { width:340px; flex-shrink:0; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
        .terminal-panel::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(88,101,242,0.4),transparent); }
        .terminal-panel h3 { font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:2px; color:var(--text-dim); margin-bottom:14px; }
        .cmd-btn { font-family:'Space Mono',monospace; font-size:9px; padding:10px; background:rgba(88,101,242,0.12); border:1px solid rgba(88,101,242,0.25); border-radius:8px; color:#fff; cursor:pointer; width:100%; margin-bottom:12px; }
        .cmd-btn:hover { background:rgba(88,101,242,0.22); }
        .cmds-list { display:none; max-height:180px; overflow-y:auto; background:rgba(0,0,0,0.35); border-radius:8px; padding:6px; margin-bottom:12px; }
        .cmds-list.show { display:block; }
        .cmds-list div { padding:8px 12px; cursor:pointer; border-radius:6px; font-family:'Space Mono',monospace; font-size:9px; color:rgba(255,255,255,0.5); }
        .cmds-list div:hover { background:rgba(88,101,242,0.2); color:#fff; }
        .chat-messages { flex:1; overflow-y:auto; margin-bottom:12px; display:flex; flex-direction:column; gap:6px; }
        .chat-messages .msg { padding:9px 12px; border-radius:10px; font-size:11px; max-width:85%; animation:fadeInUp 0.3s; }
        .chat-messages .user { background:rgba(88,101,242,0.3); align-self:flex-end; }
        .chat-messages .bot { background:rgba(255,255,255,0.04); align-self:flex-start; color:rgba(255,255,255,0.7); }
        .chat-input { display:flex; gap:6px; }
        .chat-input input { flex:1; padding:10px 14px; border:1px solid rgba(255,255,255,0.08); border-radius:8px; background:rgba(0,0,0,0.35); color:#fff; font-size:11px; font-family:'Inter',sans-serif; outline:none; }
        .chat-input input:focus { border-color:rgba(88,101,242,0.5); }
        .chat-input button { padding:10px 16px; background:rgba(88,101,242,0.3); border:1px solid rgba(88,101,242,0.4); border-radius:8px; color:#fff; cursor:pointer; font-family:'Space Mono',monospace; }
        .chat-input button:hover { background:rgba(88,101,242,0.5); }
        
        .pending-panel { flex:1; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; overflow-y:auto; position:relative; }
        .pending-panel::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent); }
        .pending-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
        .pending-header h3 { font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:2px; color:var(--text-dim); }
        .pending-filters { display:flex; gap:6px; }
        .filter-btn { font-family:'Space Mono',monospace; font-size:8px; padding:6px 12px; border:1px solid rgba(255,255,255,0.08); border-radius:20px; background:transparent; color:rgba(255,255,255,0.4); cursor:pointer; }
        .filter-btn.active { background:rgba(88,101,242,0.25); border-color:rgba(88,101,242,0.5); color:#fff; }
        .pending-item { padding:14px 16px; border:1px solid rgba(255,255,255,0.04); border-radius:10px; margin-bottom:8px; display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.2); flex-wrap:wrap; }
        .pending-item:hover { border-color:rgba(255,255,255,0.1); background:rgba(0,0,0,0.35); transform:translateX(4px); }
        .pending-item.done-item { opacity:0.5; }
        .badge { padding:4px 10px; border-radius:6px; font-size:8px; font-family:'Space Mono',monospace; text-transform:uppercase; }
        .badge-active { background:rgba(255,107,107,0.2); color:#ff6b6b; border:1px solid rgba(255,107,107,0.3); }
        .badge-done { background:rgba(46,204,113,0.2); color:#2ecc71; border:1px solid rgba(46,204,113,0.3); }
        .pending-info { flex:1; display:flex; flex-direction:column; gap:3px; min-width:130px; }
        .pending-command { font-family:'Space Mono',monospace; font-size:11px; color:#fff; font-weight:600; }
        .pending-params { font-size:10px; color:rgba(255,255,255,0.35); }
        .pending-result { font-size:10px; color:rgba(255,255,255,0.5); margin-top:2px; }
        .pending-time { font-family:'Space Mono',monospace; font-size:8px; color:rgba(255,255,255,0.2); }
        .empty-state { text-align:center; padding:60px 20px; color:rgba(255,255,255,0.2); font-family:'Space Mono',monospace; font-size:10px; letter-spacing:2px; }
        .mobile-toggle { display:none; font-family:'Space Mono',monospace; font-size:9px; padding:10px; background:rgba(88,101,242,0.15); border:1px solid rgba(88,101,242,0.3); border-radius:10px; color:#fff; cursor:pointer; margin-bottom:12px; width:100%; text-align:center; }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        @media (min-width:769px) { .terminal-panel { display:flex !important; } .pending-panel { display:block !important; } }
        @media (max-width:768px) {
            .container { padding:12px; }
            .mobile-toggle { display:block; }
            .main-layout { flex-direction:column; height:auto; gap:10px; }
            .terminal-panel { width:100%; height:auto; max-height:55vh; display:none; }
            .terminal-panel.show-mobile { display:flex; }
            .pending-panel { height:auto; max-height:55vh; display:none; }
            .pending-panel.show-mobile { display:block; }
            .chat-input input { font-size:16px; }
            .header h1 { font-size:1.2rem; }
            .role-badge { display:none; }
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <div class="header">
            <a href="/dashboard" class="back-btn">← Voltar</a>
            <div>
                <span class="brand-id">System Node: HV-CMD</span>
                <h1>Pendências</h1>
            </div>
            <span class="role-badge" id="roleBadge">Role: FULL</span>
        </div>

        <button class="mobile-toggle" id="mobileToggle" onclick="toggleMobileView()">📋 Ver Pendências</button>

        <div class="main-layout">
            <div class="terminal-panel" id="terminalPanel">
                <h3>🤖 Terminal</h3>
                <button class="cmd-btn" onclick="toggleCmds()">📋 Listar Comandos</button>
                <div class="cmds-list" id="cmdsList"></div>
                <div class="chat-messages" id="chatMessages">
                    <div class="msg bot">Digite /comando para executar</div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="/comando..." onkeypress="if(event.key==='Enter')sendChat()">
                    <button onclick="sendChat()">▶</button>
                </div>
            </div>

            <div class="pending-panel" id="pendingPanel">
                <div class="pending-header">
                    <h3>📋 Histórico</h3>
                    <div class="pending-filters">
                        <button class="filter-btn active" onclick="filterPendings('all',this)">Todas</button>
                        <button class="filter-btn" onclick="filterPendings('active',this)">⏳ Ativas</button>
                        <button class="filter-btn" onclick="filterPendings('done',this)">✓ Concluídas</button>
                    </div>
                </div>
                <div id="pendingList"><div class="empty-state">Carregando...</div></div>
            </div>
        </div>
    </div>

    <script>
    (function(){
        'use strict';

        // Blobs
        const blobs = document.querySelectorAll('.blob');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            blobs.forEach((b, i) => b.style.transform = `translate(${x*(i+1)*10}px, ${y*(i+1)*10}px)`);
        });

        let allPendings = [], currentFilter = 'all';
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const userRole = user.role || 'full';
        document.getElementById('roleBadge').textContent = 'Role: ' + userRole.toUpperCase();

        const commandsByRole = {
            full: ['ping','uptime','stats','servidor','bot','say','anuncio','modo','voicemode','mencionar','autointervalo','automsg'],
            owner: ['ping','uptime','stats','say','anuncio','autointervalo','automsg'],
            admin: ['ping','say','automsg'],
            tester: ['ping','uptime','bot']
        };

        function init() {
            if (!localStorage.getItem('token')) { window.location.href = '/'; return; }
            setupMobile();
            loadPendings();
            setInterval(loadPendings, 15000);
            window.addEventListener('resize', setupMobile);
        }

        function setupMobile() {
            const isMobile = window.innerWidth <= 768;
            const toggle = document.getElementById('mobileToggle');
            const terminal = document.getElementById('terminalPanel');
            const pending = document.getElementById('pendingPanel');
            
            if (isMobile) {
                toggle.style.display = 'block';
                if (!toggle.dataset.init) {
                    toggle.dataset.init = '1';
                    terminal.classList.add('show-mobile');
                    pending.classList.remove('show-mobile');
                }
            } else {
                toggle.style.display = 'none';
                terminal.style.display = 'flex';
                pending.style.display = 'block';
            }
        }

        window.toggleMobileView = function() {
            const terminal = document.getElementById('terminalPanel');
            const pending = document.getElementById('pendingPanel');
            const toggle = document.getElementById('mobileToggle');
            
            if (terminal.classList.contains('show-mobile')) {
                terminal.classList.remove('show-mobile');
                pending.classList.add('show-mobile');
                toggle.textContent = '💬 Terminal';
            } else {
                terminal.classList.add('show-mobile');
                pending.classList.remove('show-mobile');
                toggle.textContent = '📋 Ver Pendências';
            }
        };

        window.filterPendings = function(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPendings();
        };

        function renderPendings() {
            const list = document.getElementById('pendingList');
            let f = allPendings;
            if (currentFilter === 'active') f = allPendings.filter(p => !p.done);
            else if (currentFilter === 'done') f = allPendings.filter(p => p.done);
            
            if (f.length === 0) {
                list.innerHTML = '<div class="empty-state">Nenhuma pendência</div>';
                return;
            }

            list.innerHTML = f.map(p => `
                <div class="pending-item ${p.done ? 'done-item' : ''}">
                    <span class="badge ${p.done ? 'badge-done' : 'badge-active'}">${p.done ? '✓ Done' : '⏳ Active'}</span>
                    <div class="pending-info">
                        <span class="pending-command">/${p.command}</span>
                        ${p.params ? '<span class="pending-params">' + p.params + '</span>' : ''}
                        ${p.result ? '<span class="pending-result">' + p.result + '</span>' : ''}
                    </div>
                    <span class="pending-time">${p.time}</span>
                </div>
            `).join('');
        }

        window.toggleCmds = function() {
            const list = document.getElementById('cmdsList');
            if (list.classList.contains('show')) { list.classList.remove('show'); return; }
            const cmds = commandsByRole[userRole] || commandsByRole.full;
            list.innerHTML = cmds.map(c => `<div onclick="document.getElementById('chatInput').value='/${c}';document.getElementById('cmdsList').classList.remove('show')">/${c}</div>`).join('');
            list.classList.add('show');
        };

        window.sendChat = function() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            addChatMsg('user', msg);
            input.value = '';
            
            if (msg.startsWith('/')) {
                const parts = msg.substring(1).split(' ');
                const command = parts[0];
                const params = parts.slice(1).join(' ');
                
                const np = { command, params, result: '', time: new Date().toLocaleString('pt-BR'), done: false };
                allPendings.unshift(np);
                renderPendings();
                
                const md = addChatMsg('bot', '⏳ /' + command + '...');
                
                fetch('/api/pendings/executar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: JSON.stringify({ command, params })
                })
                .then(r => r.json())
                .then(d => { np.done = true; np.result = d.result || d.message || '✅ OK'; md.textContent = np.result; renderPendings(); loadPendings(); })
                .catch(() => { setTimeout(() => { np.done = true; np.result = '✅ /' + command; md.textContent = np.result; renderPendings(); }, 2000); });
            }
        };

        function addChatMsg(type, text) {
            const msgs = document.getElementById('chatMessages');
            const first = msgs.querySelector('.msg.bot');
            if (first && first.textContent === 'Digite /comando para executar') first.remove();
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.textContent = text;
            msgs.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
            return div;
        }

        async function loadPendings() {
            try {
                const res = await fetch('/api/pendings/list', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.pendings && Array.isArray(data.pendings)) {
                        allPendings = data.pendings.map(p => ({
                            command: p.command || 'comando',
                            params: p.params || '',
                            result: p.result || '',
                            time: p.createdAt ? new Date(p.createdAt).toLocaleString('pt-BR') : '',
                            done: p.done === true
                        }));
                    }
                }
            } catch (e) {}
            renderPendings();
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
