<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostVille BOT - Pendências</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --card: rgba(255,255,255,0.03); --card-hover: rgba(255,255,255,0.06); --text: #ffffff; --text-dim: rgba(255,255,255,0.5); --border: rgba(255,255,255,0.06); --border-hover: rgba(255,255,255,0.12); --radius: 14px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; width: 100vw; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .stage { position: fixed; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(60px); }
        .blob-1 { width: 400px; height: 400px; background: rgba(88,101,242,0.3); left: -5%; top: -10%; animation: float1 20s ease-in-out infinite; }
        .blob-2 { width: 350px; height: 350px; background: rgba(255,255,255,0.15); left: 55%; top: -5%; animation: float2 25s ease-in-out infinite; }
        .blob-3 { width: 500px; height: 500px; background: rgba(88,101,242,0.2); left: 25%; top: 40%; animation: float3 30s ease-in-out infinite; }
        @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(100px,-50px) scale(1.15)} 50%{transform:translate(-40px,80px) scale(0.9)} 75%{transform:translate(-80px,-30px) scale(1.1)} }
        @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-60px,60px) scale(1.2)} 66%{transform:translate(50px,-80px) scale(0.85)} }
        @keyframes float3 { 0%,100%{transform:translate(0,0) scale(1)} 20%{transform:translate(80px,40px) scale(1.1)} 40%{transform:translate(-50px,-60px) scale(0.9)} 60%{transform:translate(30px,80px) scale(1.15)} 80%{transform:translate(-70px,-30px) scale(0.95)} }
        .container { position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; padding: 24px; }
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; padding-bottom: 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .back-btn { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); text-decoration: none; letter-spacing: 2px; text-transform: uppercase; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; }
        .back-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
        .header h1 { font-weight: 800; font-size: clamp(1.3rem, 4vw, 2rem); line-height: 0.9; letter-spacing: -1.5px; flex: 1; }
        .brand-id { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--text-dim); display: block; margin-bottom: 4px; }
        .main-layout { display: flex; gap: 16px; height: calc(100vh - 250px); min-height: 400px; }
        .terminal-panel { width: 340px; flex-shrink: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; }
        .terminal-panel h3 { font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 14px; }
        .cmd-btn { font-family: 'Space Mono', monospace; font-size: 9px; padding: 10px; background: rgba(88,101,242,0.12); border: 1px solid rgba(88,101,242,0.25); border-radius: 8px; color: #fff; cursor: pointer; width: 100%; margin-bottom: 12px; }
        .cmd-btn:hover { background: rgba(88,101,242,0.22); }
        .cmds-list { display: none; max-height: 180px; overflow-y: auto; background: rgba(0,0,0,0.35); border-radius: 8px; padding: 6px; margin-bottom: 12px; }
        .cmds-list.show { display: block; }
        .cmds-list div { padding: 8px 12px; cursor: pointer; border-radius: 6px; font-family: 'Space Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.5); }
        .cmds-list div:hover { background: rgba(88,101,242,0.2); color: #fff; }
        .chat-messages { flex: 1; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .chat-messages .msg { padding: 9px 12px; border-radius: 10px; font-size: 11px; max-width: 85%; }
        .chat-messages .user { background: rgba(88,101,242,0.3); align-self: flex-end; }
        .chat-messages .bot { background: rgba(255,255,255,0.04); align-self: flex-start; color: rgba(255,255,255,0.7); }
        .chat-input { display: flex; gap: 6px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; background: rgba(0,0,0,0.35); color: #fff; font-size: 11px; font-family: 'Inter', sans-serif; outline: none; }
        .chat-input button { padding: 10px 16px; background: rgba(88,101,242,0.3); border: 1px solid rgba(88,101,242,0.4); border-radius: 8px; color: #fff; cursor: pointer; font-family: 'Space Mono', monospace; }
        .pending-panel { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; overflow-y: auto; }
        .pending-panel h3 { font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 16px; }
        .pending-filters { display: flex; gap: 6px; margin-bottom: 16px; }
        .filter-btn { font-family: 'Space Mono', monospace; font-size: 8px; padding: 6px 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; background: transparent; color: rgba(255,255,255,0.4); cursor: pointer; }
        .filter-btn.active { background: rgba(88,101,242,0.25); border-color: rgba(88,101,242,0.5); color: #fff; }
        .pending-item { padding: 14px 16px; border: 1px solid rgba(255,255,255,0.04); border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.2); flex-wrap: wrap; }
        .pending-item.done-item { opacity: 0.5; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 8px; font-family: 'Space Mono', monospace; text-transform: uppercase; }
        .badge-active { background: rgba(255,107,107,0.2); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
        .badge-done { background: rgba(46,204,113,0.2); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
        .pending-info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 130px; }
        .pending-command { font-family: 'Space Mono', monospace; font-size: 11px; color: #fff; font-weight: 600; }
        .pending-params { font-size: 10px; color: rgba(255,255,255,0.35); }
        .pending-result { font-size: 10px; color: rgba(255,255,255,0.5); }
        .pending-time { font-family: 'Space Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.2); }
        .empty-state { text-align: center; padding: 40px; color: rgba(255,255,255,0.2); font-family: 'Space Mono', monospace; font-size: 10px; }

        /* LOG PANEL */
        .log-panel { margin-top: 16px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,0,0.3); border-radius: 10px; padding: 14px; max-height: 120px; overflow-y: auto; font-family: 'Space Mono', monospace; font-size: 9px; }
        .log-panel h3 { color: rgba(255,255,0,0.6); font-size: 9px; margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
        .log-line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-success { color: #2ecc71; }
        .log-error { color: #ff6b6b; }
        .log-info { color: rgba(255,255,255,0.5); }
        .log-warn { color: #f39c12; }

        @media (max-width: 768px) {
            .container { padding: 12px; }
            .main-layout { flex-direction: column; height: auto; }
            .terminal-panel { width: 100%; }
            .chat-input input { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="container">
        <div class="header">
            <a href="/dashboard" class="back-btn">← Voltar</a>
            <div>
                <span class="brand-id">System Node: HV-CMD</span>
                <h1>Pendências</h1>
            </div>
        </div>
        <div class="main-layout">
            <div class="terminal-panel" id="terminalPanel">
                <h3>🤖 Terminal</h3>
                <button class="cmd-btn" onclick="toggleCmds()">📋 Listar Comandos</button>
                <div class="cmds-list" id="cmdsList"></div>
                <div class="chat-messages" id="chatMessages"><div class="msg bot">Digite /comando</div></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="/comando..." onkeypress="if(event.key==='Enter')sendChat()">
                    <button onclick="sendChat()">▶</button>
                </div>
            </div>
            <div class="pending-panel" id="pendingPanel">
                <h3>📋 Histórico</h3>
                <div class="pending-filters">
                    <button class="filter-btn active" onclick="filterPendings('all',this)">Todas</button>
                    <button class="filter-btn" onclick="filterPendings('active',this)">⏳ Ativas</button>
                    <button class="filter-btn" onclick="filterPendings('done',this)">✓ Concluídas</button>
                </div>
                <div id="pendingList"><div class="empty-state">Carregando...</div></div>
            </div>
        </div>
        
        <!-- PAINEL DE LOGS -->
        <div class="log-panel" id="logPanel">
            <h3>📋 Logs de Debug</h3>
            <div id="logContent"></div>
        </div>
    </div>

    <script>
    (function(){
        'use strict';

        const blobs = document.querySelectorAll('.blob');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            blobs.forEach((b, i) => b.style.transform = `translate(${x*(i+1)*10}px, ${y*(i+1)*10}px)`);
        });

        // Função de log
        function addLog(msg, type) {
            const logContent = document.getElementById('logContent');
            const div = document.createElement('div');
            div.className = 'log-line log-' + (type || 'info');
            const time = new Date().toLocaleTimeString('pt-BR');
            div.textContent = '[' + time + '] ' + msg;
            logContent.appendChild(div);
            logContent.scrollTop = logContent.scrollHeight;
            console.log('📋 ' + msg);
        }

        let allPendings = [], currentFilter = 'all';
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const userRole = user.role || 'full';
        
        addLog('✅ Página carregada', 'success');
        addLog('👤 Usuário: ' + (user.name || 'N/A') + ' | Role: ' + userRole, 'info');
        addLog('🔑 Token: ' + (localStorage.getItem('token') ? 'Presente (' + localStorage.getItem('token').substring(0, 15) + '...)' : 'AUSENTE!'), localStorage.getItem('token') ? 'success' : 'error');

        const commandsByRole = {
            full: ['ping','uptime','stats','servidor','bot','say','anuncio','modo','voicemode','mencionar','autointervalo','automsg'],
            owner: ['ping','uptime','stats','say','anuncio','autointervalo','automsg'],
            admin: ['ping','say','automsg'],
            tester: ['ping','uptime','bot']
        };

        function init() {
            if (!localStorage.getItem('token')) {
                addLog('❌ Sem token! Redirecionando...', 'error');
                window.location.href = '/';
                return;
            }
            addLog('🔄 Iniciando loadPendings()...', 'info');
            loadPendings();
            setInterval(loadPendings, 15000);
        }

        window.filterPendings = function(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        };

        function render() {
            const list = document.getElementById('pendingList');
            let f = allPendings;
            if (currentFilter === 'active') f = allPendings.filter(p => !p.done);
            else if (currentFilter === 'done') f = allPendings.filter(p => p.done);
            
            addLog('📊 Renderizando: ' + f.length + ' pendências (filtro: ' + currentFilter + ')', 'info');
            
            if (f.length === 0) {
                list.innerHTML = '<div class="empty-state">Nenhuma pendência</div>';
                return;
            }
            list.innerHTML = f.map(p => `
                <div class="pending-item ${p.done ? 'done-item' : ''}">
                    <span class="badge ${p.done ? 'badge-done' : 'badge-active'}">${p.done ? '✓ Done' : '⏳ Active'}</span>
                    <div class="pending-info">
                        <span class="pending-command">/${p.command}</span>
                        ${p.params ? '<span class="pending-params">' + p.params + '</span>' : ''}
                        ${p.result ? '<span class="pending-result">' + p.result + '</span>' : ''}
                    </div>
                    <span class="pending-time">${p.time}</span>
                </div>
            `).join('');
        }

        window.toggleCmds = function() {
            const list = document.getElementById('cmdsList');
            if (list.classList.contains('show')) { list.classList.remove('show'); return; }
            const cmds = commandsByRole[userRole] || commandsByRole.full;
            addLog('📋 Mostrando ' + cmds.length + ' comandos para role: ' + userRole, 'info');
            list.innerHTML = cmds.map(c => `<div onclick="document.getElementById('chatInput').value='/${c}';document.getElementById('cmdsList').classList.remove('show')">/${c}</div>`).join('');
            list.classList.add('show');
        };

        window.sendChat = function() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            addChatMsg('user', msg);
            input.value = '';
            
            if (msg.startsWith('/')) {
                const parts = msg.substring(1).split(' ');
                const command = parts[0];
                const params = parts.slice(1).join(' ');
                
                addLog('⚡ Comando: /' + command + ' ' + params, 'warn');
                
                const np = { command, params, result: '', time: new Date().toLocaleString('pt-BR'), done: false };
                allPendings.unshift(np);
                render();
                
                const md = addChatMsg('bot', '⏳ /' + command + '...');
                
                addLog('📤 Enviando para API: /api/pendings/executar', 'info');
                
                fetch('/api/pendings/executar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: JSON.stringify({ command, params })
                })
                .then(r => {
                    addLog('📥 Status da resposta: ' + r.status + ' ' + r.statusText, r.ok ? 'success' : 'error');
                    return r.json();
                })
                .then(d => {
                    addLog('📦 Dados recebidos: ' + JSON.stringify(d).substring(0, 100), 'success');
                    np.done = true;
                    np.result = d.result || d.message || '✅ OK';
                    md.textContent = np.result;
                    render();
                    addLog('🔄 Atualizando lista da API...', 'info');
                    loadPendings();
                })
                .catch(e => {
                    addLog('❌ Erro: ' + e.message, 'error');
                    setTimeout(() => {
                        np.done = true;
                        np.result = '✅ /' + command;
                        md.textContent = np.result;
                        render();
                    }, 2000);
                });
            }
        };

        function addChatMsg(type, text) {
            const msgs = document.getElementById('chatMessages');
            const first = msgs.querySelector('.msg.bot');
            if (first && first.textContent === 'Digite /comando') first.remove();
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.textContent = text;
            msgs.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
            return div;
        }

        async function loadPendings() {
            addLog('🔄 Iniciando fetch para /api/pendings/list...', 'warn');
            
            try {
                const token = localStorage.getItem('token');
                addLog('🔑 Token usado: ' + (token ? token.substring(0, 20) + '...' : 'AUSENTE'), 'info');
                
                const res = await fetch('/api/pendings/list', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                addLog('📡 Status HTTP: ' + res.status + ' ' + res.statusText, res.ok ? 'success' : 'error');
                addLog('📋 Content-Type: ' + res.headers.get('content-type'), 'info');
                
                const text = await res.text();
                addLog('📄 Resposta bruta (primeiros 200 chars): ' + text.substring(0, 200), 'info');
                
                let data;
                try {
                    data = JSON.parse(text);
                    addLog('✅ JSON parseado com sucesso', 'success');
                } catch (e) {
                    addLog('❌ Resposta NÃO é JSON válido!', 'error');
                    addLog('📄 Conteúdo completo: ' + text, 'error');
                    return;
                }
                
                addLog('🔑 Chaves do objeto: ' + Object.keys(data).join(', '), 'info');
                addLog('📦 Tipo de data.pendings: ' + typeof data.pendings, 'info');
                
                if (data.pendings && Array.isArray(data.pendings)) {
                    addLog('✅ Array de pendings encontrado! Tamanho: ' + data.pendings.length, 'success');
                    
                    if (data.pendings.length > 0) {
                        addLog('📋 Primeiro item: ' + JSON.stringify(data.pendings[0]), 'info');
                    }
                    
                    allPendings = data.pendings.map((p, i) => {
                        const cmd = p.command || p.type || 'comando';
                        const prm = p.params || (p.data && p.data.params) || '';
                        const res = p.result || (p.data && p.data.result) || '';
                        const done = p.done === true || p.done === 'true';
                        const time = p.createdAt ? new Date(p.createdAt).toLocaleString('pt-BR') : '';
                        
                        if (i === 0) {
                            addLog('🔄 Processando item 0: cmd=' + cmd + ' done=' + done + ' time=' + time, 'info');
                        }
                        
                        return { command: cmd, params: prm, result: res, time: time, done: done };
                    });
                    
                    addLog('✅ Total processado: ' + allPendings.length + ' pendências', 'success');
                } else if (Array.isArray(data)) {
                    addLog('✅ Resposta é um array direto! Tamanho: ' + data.length, 'success');
                    allPendings = data.map(p => ({
                        command: p.command || p.type || 'comando',
                        params: p.params || '',
                        result: p.result || '',
                        time: p.createdAt ? new Date(p.createdAt).toLocaleString('pt-BR') : '',
                        done: p.done === true
                    }));
                } else {
                    addLog('⚠️ Nenhum array encontrado na resposta', 'warn');
                    addLog('📄 Resposta completa: ' + JSON.stringify(data), 'warn');
                }
            } catch (e) {
                addLog('❌ Erro na requisição: ' + e.message, 'error');
            }
            
            addLog('🔄 Chamando render()...', 'info');
            render();
            addLog('✅ loadPendings() finalizado', 'success');
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
