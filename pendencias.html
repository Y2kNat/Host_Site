<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostVille BOT - Pendências</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: rgba(255,255,255,0.03);
            --card-hover: rgba(255,255,255,0.06);
            --text: #ffffff;
            --text-dim: rgba(255,255,255,0.5);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.6s ease-out;
        }
        #loading-overlay canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #loading-overlay .loading-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-weight: 200; font-size: 2rem;
            letter-spacing: 0.4em; text-transform: uppercase;
            white-space: nowrap; opacity: 0; z-index: 10;
            pointer-events: none; user-select: none;
            font-family: 'Segoe UI', 'Helvetica Neue', 'Arial', sans-serif;
        }
        #loading-overlay.fade-out { opacity: 0; pointer-events: none; }
        #loading-overlay.hidden { display: none; }

        #main-content {
            opacity: 0; transition: opacity 0.8s ease-in;
            position: relative; z-index: 10; min-height: 100vh;
        }
        #main-content.visible { opacity: 1; }

        .stage {
            position: fixed; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; overflow: hidden;
        }
        .blob {
            position: absolute; border-radius: 50%;
            filter: blur(60px); will-change: transform; transform: translateZ(0);
        }
        .blob-1 { width:400px; height:400px; background:rgba(88,101,242,0.3); left:-5%; top:-10%; animation:float1 20s ease-in-out infinite; }
        .blob-2 { width:350px; height:350px; background:rgba(255,255,255,0.15); left:55%; top:-5%; animation:float2 25s ease-in-out infinite; }
        .blob-3 { width:500px; height:500px; background:rgba(88,101,242,0.2); left:25%; top:40%; animation:float3 30s ease-in-out infinite; }
        .blob-4 { width:300px; height:300px; background:rgba(255,255,255,0.12); left:70%; top:35%; animation:float1 22s ease-in-out infinite reverse; }
        .blob-5 { width:380px; height:380px; background:rgba(88,101,242,0.25); left:10%; top:55%; animation:float2 28s ease-in-out infinite reverse; }
        .blob-6 { width:250px; height:250px; background:rgba(255,255,255,0.1); left:45%; top:0%; animation:float3 18s ease-in-out infinite; }

        @keyframes float1 {
            0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(100px,-50px) scale(1.15)} 50%{transform:translate(-40px,80px) scale(0.9)} 75%{transform:translate(-80px,-30px) scale(1.1)}
        }
        @keyframes float2 {
            0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-60px,60px) scale(1.2)} 66%{transform:translate(50px,-80px) scale(0.85)}
        }
        @keyframes float3 {
            0%,100%{transform:translate(0,0) scale(1)} 20%{transform:translate(80px,40px) scale(1.1)} 40%{transform:translate(-50px,-60px) scale(0.9)} 60%{transform:translate(30px,80px) scale(1.15)} 80%{transform:translate(-70px,-30px) scale(0.95)}
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 24px; padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap;
        }
        .back-btn {
            font-family: 'Space Mono', monospace; font-size: 10px;
            color: rgba(255,255,255,0.5); text-decoration: none;
            letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s; padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px; background: transparent;
            cursor: pointer; white-space: nowrap;
        }
        .back-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
        .header h1 {
            font-weight: 800; font-size: clamp(1.2rem, 4vw, 1.8rem);
            letter-spacing: -1px; color: #fff; flex: 1; min-width: 200px;
        }
        .header .brand-id {
            font-family: 'Space Mono', monospace; font-size: 8px;
            letter-spacing: 3px; text-transform: uppercase;
            color: rgba(255,255,255,0.35); white-space: nowrap;
        }

        .main-layout { display: flex; gap: 16px; height: calc(100vh - 160px); min-height: 500px; }
        .chat-panel {
            width: 320px; flex-shrink: 0; background: var(--card);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 16px; display: flex; flex-direction: column;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .chat-panel:hover { border-color: var(--border-hover); background: var(--card-hover); }
        .chat-panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(88,101,242,0.3), transparent);
        }
        .chat-panel h3 {
            font-family: 'Space Mono', monospace; font-size: 10px;
            text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-dim); margin-bottom: 12px; font-weight: 600;
        }
        .cmd-btn {
            font-family: 'Space Mono', monospace; font-size: 9px;
            padding: 10px 14px; background: rgba(88,101,242,0.15);
            border: 1px solid rgba(88,101,242,0.3); border-radius: 8px;
            color: rgba(255,255,255,0.8); cursor: pointer; letter-spacing: 1px;
            text-transform: uppercase; transition: all 0.3s;
            width: 100%; margin-bottom: 10px;
        }
        .cmd-btn:hover { background: rgba(88,101,242,0.25); border-color: rgba(88,101,242,0.5); }
        .cmds-list {
            display: none; margin-bottom: 10px; max-height: 200px;
            overflow-y: auto; background: rgba(0,0,0,0.3);
            border-radius: 8px; padding: 6px;
        }
        .cmds-list.show { display: block; }
        .cmds-list div {
            padding: 7px 10px; cursor: pointer; border-radius: 6px;
            font-family: 'Space Mono', monospace; font-size: 9px;
            color: rgba(255,255,255,0.6); transition: all 0.2s;
        }
        .cmds-list div:hover { background: rgba(88,101,242,0.2); color: #fff; }
        .chat-messages {
            flex: 1; overflow-y: auto; margin-bottom: 10px;
            display: flex; flex-direction: column; gap: 6px; min-height: 0;
        }
        .chat-messages .msg {
            padding: 8px 10px; border-radius: 10px;
            font-size: 11px; line-height: 1.4;
            max-width: 85%; word-wrap: break-word;
            animation: fadeInUp 0.3s ease-out;
        }
        .chat-messages .user { background: rgba(88,101,242,0.3); align-self: flex-end; }
        .chat-messages .bot { background: rgba(255,255,255,0.05); align-self: flex-start; }
        .chat-input { display: flex; gap: 6px; }
        .chat-input input {
            flex: 1; padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; background: rgba(0,0,0,0.3);
            color: #fff; font-size: 11px; font-family: 'Inter', sans-serif;
            transition: all 0.3s; outline: none; min-width: 0;
        }
        .chat-input input:focus { border-color: rgba(88,101,242,0.5); }
        .chat-input button {
            padding: 10px 14px; background: rgba(88,101,242,0.3);
            border: 1px solid rgba(88,101,242,0.4); border-radius: 8px;
            color: #fff; cursor: pointer; font-size: 12px;
            font-family: 'Space Mono', monospace;
        }
        .chat-input button:hover { background: rgba(88,101,242,0.5); }

        .pending-panel {
            flex: 1; background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px;
            overflow-y: auto; transition: all 0.3s;
            position: relative; min-width: 0;
        }
        .pending-panel:hover { border-color: var(--border-hover); background: var(--card-hover); }
        .pending-panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }
        .pending-panel h3 {
            font-family: 'Space Mono', monospace; font-size: 10px;
            text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-dim); margin-bottom: 16px; font-weight: 600;
        }
        .pending-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-btn {
            font-family: 'Space Mono', monospace; font-size: 9px;
            padding: 6px 12px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; background: transparent;
            color: rgba(255,255,255,0.5); cursor: pointer;
            letter-spacing: 1px; text-transform: uppercase;
            transition: all 0.3s; white-space: nowrap;
        }
        .filter-btn:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
        .filter-btn.active { background: rgba(88,101,242,0.3); border-color: rgba(88,101,242,0.5); color: #fff; }
        .pending-item {
            padding: 12px 14px; border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px; margin-bottom: 6px;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.3s; background: rgba(0,0,0,0.2); flex-wrap: wrap;
        }
        .pending-item:hover { border-color: rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); }
        .pending-item.done-item { opacity: 0.6; }
        .pending-item.done-item:hover { opacity: 0.8; }
        .badge {
            padding: 4px 8px; border-radius: 6px; font-size: 9px;
            font-family: 'Space Mono', monospace; letter-spacing: 1px;
            text-transform: uppercase; flex-shrink: 0;
        }
        .badge-active { background: rgba(231,76,60,0.2); color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }
        .badge-done { background: rgba(46,204,113,0.2); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
        .pending-info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 120px; }
        .pending-command { font-family: 'Space Mono', monospace; font-size: 11px; color: #fff; font-weight: 600; }
        .pending-params { font-size: 10px; color: rgba(255,255,255,0.4); }
        .pending-result { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
        .pending-time { font-family: 'Space Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.25); flex-shrink: 0; }
        .empty-state {
            text-align: center; padding: 40px 20px;
            color: rgba(255,255,255,0.25); font-family: 'Space Mono', monospace;
            font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
        }
        .mobile-toggle {
            display: none; font-family: 'Space Mono', monospace; font-size: 9px;
            padding: 8px 14px; background: rgba(88,101,242,0.15);
            border: 1px solid rgba(88,101,242,0.3); border-radius: 8px;
            color: rgba(255,255,255,0.8); cursor: pointer; letter-spacing: 1px;
            text-transform: uppercase; transition: all 0.3s; margin-bottom: 10px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header h1 { font-size: 1.1rem; min-width: auto; }
            .brand-id { display: none; }
            .mobile-toggle { display: block; }
            .main-layout { flex-direction: column; height: auto; gap: 10px; }
            .chat-panel { width: 100%; height: auto; max-height: 60vh; display: none; }
            .chat-panel.show-mobile { display: flex; }
            .pending-panel { height: auto; max-height: 60vh; }
            .pending-panel.hide-mobile { display: none; }
            .chat-input input { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none; }
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <canvas id="loading-canvas"></canvas>
        <div class="loading-text" id="loading-text">LOADING</div>
    </div>

    <div id="main-content">
        <div class="stage">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="blob blob-4"></div>
            <div class="blob blob-5"></div>
            <div class="blob blob-6"></div>
        </div>

        <div class="container">
            <div class="header">
                <a href="/dashboard" class="back-btn">← Voltar</a>
                <h1>⚡ Pendências & Comandos</h1>
                <span class="brand-id" id="roleDisplay">System Node: HV-CMD</span>
            </div>
            
            <button class="mobile-toggle" id="mobileToggle" onclick="toggleMobileView()">📋 Ver Pendências</button>
            
            <div class="main-layout">
                <div class="chat-panel show-mobile" id="chatPanel">
                    <h3>🤖 Terminal de Comandos</h3>
                    <button class="cmd-btn" onclick="toggleCmds()">📋 Listar Comandos</button>
                    <div class="cmds-list" id="cmdsList"></div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="msg bot">Digite /comando para executar</div>
                    </div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="/comando..." onkeypress="if(event.key==='Enter')sendChat()">
                        <button onclick="sendChat()">▶</button>
                    </div>
                </div>
                
                <div class="pending-panel" id="pendingPanel">
                    <h3>📋 Histórico de Pendências</h3>
                    <div class="pending-filters">
                        <button class="filter-btn active" onclick="filterPendings('all', this)">Todas</button>
                        <button class="filter-btn" onclick="filterPendings('active', this)">⏳ Ativas</button>
                        <button class="filter-btn" onclick="filterPendings('done', this)">✓ Concluídas</button>
                    </div>
                    <div id="pendingList">
                        <div class="empty-state">Nenhuma pendência ainda</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // =============================================
        // LOADING ANIMATION
        // =============================================
        class Particle {
            constructor(bx, by, bz, s) { this.bx = bx; this.by = by; this.bz = bz; this.x = bx; this.y = by; this.z = bz; this.s = s; }
            reset() { this.x = this.bx; this.y = this.by; this.z = this.bz; }
        }
        class Camera {
            constructor() { this.z = 0; this.fl = 1.0 / Math.tan(30 * Math.PI / 180); this.near = 0.1; }
            project(px, py, pz, sw, sh) {
                const dz = pz - this.z;
                if (dz < this.near) return null;
                const sc = this.fl / dz;
                return { x: px * sc * (sw/2) + sw/2, y: -py * sc * (sh/2) + sh/2, z: dz, scale: sc };
            }
        }
        class SpiralAnimation {
            constructor(canvas, textEl, onDone) {
                this.cv = canvas; this.ctx = canvas.getContext('2d');
                this.txt = textEl; this.onDone = onDone;
                this.ps = []; this.cam = new Camera();
                this.aid = null; this.st = null;
                this.ad = 2500; this.fod = 400; this.hd = 150;
                this.done = false; this.fos = null; this.hs = null;
                this.to = 0; this.tfd = 600; this.tfdu = 400;
                this.sl = 5; this.sr = 4.5; this.sh = 14;
                this.pc = 1000; this.bs = 2; this.sv = 0.8;
                this.init(); this.resize();
                window.addEventListener('resize', () => this.resize());
            }
            init() {
                for (let i = 0; i < this.pc; i++) {
                    const t = i / (this.pc - 1);
                    const a = t * Math.PI * 2 * this.sl;
                    const rv = 0.3 * Math.sin(t*30) + 0.2;
                    const r = this.sr * (0.7 + t*0.3) + (Math.random()-0.5)*rv;
                    this.ps.push(new Particle(Math.cos(a)*r, Math.sin(a)*r, -t*this.sh + (Math.random()-0.5)*0.8, Math.max(0.6, this.bs + (Math.random()-0.5)*this.sv)));
                }
                this.cam.z = 2.5; this.iz = this.cam.z; this.fz = -this.sh - 2;
            }
            resize() {
                const dpr = window.devicePixelRatio || 1;
                const dw = window.innerWidth, dh = window.innerHeight;
                this.cv.width = dw*dpr; this.cv.height = dh*dpr;
                this.cv.style.width = dw+'px'; this.cv.style.height = dh+'px';
                this.ctx.setTransform(1,0,0,1,0,0); this.ctx.scale(dpr,dpr);
                this.dw = dw; this.dh = dh;
            }
            start() {
                if (this.aid) return;
                this.st = performance.now(); this.hs = null; this.fos = null;
                this.done = false; this.to = 0; this.txt.style.opacity = '0';
                this.ps.forEach(p => p.reset()); this.cam.z = this.iz;
                this.animate(performance.now());
            }
            animate(ts) {
                if (this.done) return;
                const e = ts - this.st;
                if (e < this.ad) this.update(e/this.ad);
                else if (!this.hs) { this.hs = ts; this.update(1); }
                else if (e < this.ad + this.hd + this.fod) {
                    if (!this.fos) this.fos = ts;
                    const fe = ts - this.fos, fp = Math.min(1, fe/this.fod);
                    const ef = fp<0.5 ? 2*fp*fp : -1+(4-2*fp)*fp;
                    const co = 1 - ef;
                    this.ctx.clearRect(0,0,this.dw,this.dh);
                    if (co > 0.01) { this.ctx.globalAlpha = co; this.render(1); this.ctx.globalAlpha = 1; }
                    this.txt.style.opacity = Math.max(0, this.to - ef);
                } else { this.finish(); return; }
                if (e < this.ad + this.hd) this.updateText(e);
                this.aid = requestAnimationFrame(t => this.animate(t));
            }
            update(prog) {
                const ep = prog<0.5 ? 4*prog*prog*prog : (prog-1)*(2*prog-2)*(2*prog-2)+1;
                this.cam.z = this.iz + (this.fz - this.iz)*ep;
                const ef = 1 + prog*0.5;
                this.ps.forEach(p => { p.x = p.bx*ef; p.y = p.by*ef; });
                this.ctx.clearRect(0,0,this.dw,this.dh);
                this.ctx.globalAlpha = 1; this.render(prog);
            }
            render(prog) {
                const ctx = this.ctx, cam = this.cam, w = this.dw, h = this.dh;
                const proj = [];
                for (let i = 0; i < this.ps.length; i++) {
                    const p = this.ps[i], pr = cam.project(p.x, p.y, p.z, w, h);
                    if (pr) proj.push({ x: pr.x, y: pr.y, z: pr.z, s: p.s*pr.scale*0.9, os: p.s });
                }
                proj.sort((a,b) => b.z - a.z);
                for (let i = 0; i < proj.length; i++) {
                    const p = proj[i];
                    const df = Math.min(1, Math.max(0.2, 1 - p.z/18));
                    const br = 0.7 + (p.os/(this.bs+this.sv))*0.3;
                    ctx.fillStyle = 'rgba(255,255,255,' + (df*br*0.9) + ')';
                    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.4, p.s*0.5), 0, Math.PI*2); ctx.fill();
                }
            }
            updateText(e) {
                if (e >= this.tfd) {
                    const fp = Math.min(1, (e-this.tfd)/this.tfdu);
                    const ef = fp<0.5 ? 2*fp*fp : -1+(4-2*fp)*fp;
                    const br = 0.7 + 0.3*(0.5 + 0.5*Math.sin(((e-this.tfd)/3200)*Math.PI*2));
                    this.to = ef*br; this.txt.style.opacity = this.to;
                }
            }
            finish() {
                this.done = true;
                if (this.aid) { cancelAnimationFrame(this.aid); this.aid = null; }
                this.ctx.clearRect(0,0,this.dw,this.dh);
                this.txt.style.opacity = '0';
                const ov = document.getElementById('loading-overlay');
                ov.classList.add('fade-out');
                setTimeout(() => {
                    ov.classList.add('hidden');
                    document.getElementById('main-content').classList.add('visible');
                    if (this.onDone) this.onDone();
                }, 600);
            }
        }

        // =============================================
        // PAGE LOGIC
        // =============================================
        let allPendings = [];
        let currentFilter = 'all';
        let pageLoaded = false;

        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const userRole = user.role || 'full';

        const commandsByRole = {
            full: ['ping', 'uptime', 'stats', 'servidor', 'bot', 'say mensagem', 'anuncio mensagem', 'modo normal/savage/hacker/respeitoso/boiola', 'voicemode on/off', 'mencionar @user', 'autointervalo 30m', 'automsg on/off'],
            owner: ['ping', 'uptime', 'stats', 'say mensagem', 'anuncio mensagem', 'autointervalo 30m', 'automsg on/off'],
            admin: ['ping', 'say mensagem', 'automsg on/off'],
            tester: ['ping', 'uptime', 'bot']
        };

        function initPage() {
            if (pageLoaded) return;
            pageLoaded = true;

            if (!localStorage.getItem('token')) {
                window.location.href = '/';
                return;
            }

            document.getElementById('roleDisplay').textContent = 'Role: ' + userRole.toUpperCase() + ' | HV-CMD';

            const blobs = document.querySelectorAll('.blob');
            document.addEventListener('mousemove', function(e) {
                const x = (e.clientX / window.innerWidth - 0.5) * 2;
                const y = (e.clientY / window.innerHeight - 0.5) * 2;
                blobs.forEach(function(b, i) { 
                    b.style.transform = 'translate(' + x*(i+1)*10 + 'px, ' + y*(i+1)*10 + 'px)'; 
                });
            });

            loadPendings();
            setInterval(loadPendings, 15000);
            window.addEventListener('resize', handleResize);
            handleResize();
        }

        function handleResize() {
            const isMobile = window.innerWidth <= 768;
            const toggle = document.getElementById('mobileToggle');
            const chatPanel = document.getElementById('chatPanel');
            const pendingPanel = document.getElementById('pendingPanel');
            
            if (isMobile) {
                toggle.style.display = 'block';
                if (!toggle.dataset.initialized) {
                    toggle.dataset.initialized = 'true';
                    chatPanel.classList.add('show-mobile');
                    pendingPanel.classList.add('hide-mobile');
                }
            } else {
                toggle.style.display = 'none';
                chatPanel.classList.add('show-mobile');
                chatPanel.classList.remove('hide-mobile');
                pendingPanel.classList.remove('show-mobile', 'hide-mobile');
            }
        }

        window.toggleMobileView = function() {
            const chatPanel = document.getElementById('chatPanel');
            const pendingPanel = document.getElementById('pendingPanel');
            const toggle = document.getElementById('mobileToggle');
            
            if (chatPanel.classList.contains('show-mobile')) {
                chatPanel.classList.remove('show-mobile');
                chatPanel.classList.add('hide-mobile');
                pendingPanel.classList.remove('hide-mobile');
                pendingPanel.classList.add('show-mobile');
                toggle.textContent = '💬 Terminal';
            } else {
                chatPanel.classList.add('show-mobile');
                chatPanel.classList.remove('hide-mobile');
                pendingPanel.classList.add('hide-mobile');
                pendingPanel.classList.remove('show-mobile');
                toggle.textContent = '📋 Ver Pendências';
            }
        };

        window.filterPendings = function(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPendings();
        };

        function renderPendings() {
            const list = document.getElementById('pendingList');
            let filtered = allPendings;
            
            if (currentFilter === 'active') filtered = allPendings.filter(p => !p.done);
            else if (currentFilter === 'done') filtered = allPendings.filter(p => p.done);
            
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">Nenhuma pendência</div>';
                return;
            }

            list.innerHTML = filtered.map(p => `
                <div class="pending-item ${p.done ? 'done-item' : ''}">
                    <span class="badge ${p.done ? 'badge-done' : 'badge-active'}">
                        ${p.done ? '✓ Done' : '⏳ Active'}
                    </span>
                    <div class="pending-info">
                        <span class="pending-command">/${p.command}</span>
                        ${p.params ? '<span class="pending-params">' + p.params + '</span>' : ''}
                        ${p.result ? '<span class="pending-result">' + p.result + '</span>' : ''}
                    </div>
                    <span class="pending-time">${p.time}</span>
                </div>
            `).join('');
        }

        window.toggleCmds = function() {
            const list = document.getElementById('cmdsList');
            if (list.classList.contains('show')) {
                list.classList.remove('show');
                return;
            }
            const cmds = commandsByRole[userRole] || commandsByRole.full;
            list.innerHTML = cmds.map(c => 
                '<div onclick="document.getElementById(\'chatInput\').value=\'/' + c + '\';document.getElementById(\'cmdsList\').classList.remove(\'show\');">/' + c + '</div>'
            ).join('');
            list.classList.add('show');
        };

        window.sendChat = function() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            
            addChatMsg('user', msg);
            input.value = '';

            if (msg.startsWith('/')) {
                const parts = msg.substring(1).split(' ');
                const command = parts[0];
                const params = parts.slice(1).join(' ');
                
                const newPending = {
                    command, params,
                    result: '',
                    time: new Date().toLocaleString('pt-BR'),
                    done: false
                };
                
                allPendings.unshift(newPending);
                renderPendings();
                
                const msgDiv = addChatMsg('bot', '⏳ Executando /' + command + '...');
                
                fetch('/api/pendings/executar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({ command, params })
                })
                .then(r => r.json())
                .then(data => {
                    newPending.done = true;
                    newPending.result = data.result || data.message || '✅ Executado';
                    msgDiv.textContent = newPending.result;
                    renderPendings();
                    loadPendings();
                })
                .catch(() => {
                    setTimeout(() => {
                        newPending.done = true;
                        newPending.result = '✅ /' + command + ' executado';
                        msgDiv.textContent = newPending.result;
                        renderPendings();
                    }, 2000);
                });
            }
        };

        function addChatMsg(type, text) {
            const msgs = document.getElementById('chatMessages');
            const first = msgs.querySelector('.msg.bot');
            if (first && first.textContent === 'Digite /comando para executar') first.remove();
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.textContent = text;
            msgs.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
            return div;
        }

        async function loadPendings() {
            try {
                const res = await fetch('/api/pending/list', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    if (data.pendings && Array.isArray(data.pendings)) {
                        allPendings = data.pendings.map(p => ({
                            command: p.command || p.type || 'comando',
                            params: p.params || (p.data && p.data.params) || '',
                            result: p.result || (p.data && p.data.result) || '',
                            time: p.createdAt ? new Date(p.createdAt).toLocaleString('pt-BR') : '',
                            done: p.done === true || p.status === 'done'
                        }));
                    }
                }
            } catch (e) {
                // API indisponível, mantém dados atuais
            }
            renderPendings();
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('loading-canvas');
            const textElement = document.getElementById('loading-text');
            
            if (!canvas || !textElement) {
                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('main-content').classList.add('visible');
                initPage();
                return;
            }

            const animation = new SpiralAnimation(canvas, textElement, initPage);
            animation.start();
        });

    })();
    </script>
</body>
</html>
