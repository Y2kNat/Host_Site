<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HostVille BOT • Premium Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <style>
        /* ================================================================
           HOSTVILLE PREMIUM DASHBOARD — DESIGN SYSTEM
           Preserved all original functionality & logic
        ================================================================ */
        :root {
            /* Core palette — dark premium, Discord-inspired blue accent */
            --bg-deep: #030305;
            --bg-elevated: #08080d;
            --surface: rgba(12, 12, 20, 0.65);
            --surface-hover: rgba(18, 18, 32, 0.82);
            --surface-active: rgba(22, 22, 40, 0.90);
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-medium: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.12);
            
            --accent: #5865F2;
            --accent-soft: rgba(88, 101, 242, 0.18);
            --accent-glow: rgba(88, 101, 242, 0.32);
            
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-tertiary: rgba(255, 255, 255, 0.32);
            --text-dim: rgba(255, 255, 255, 0.18);
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            
            --transition-smooth: 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
            --transition-fast: 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
            --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            
            /* Sidebar card expansion variables */
            --card-expanded-width: 100%;
            --card-collapsed-scale: 0.92;
            --card-depth: 0px;
            --card-lift: 0px;
            
            /* 3D perspective for cards */
            --perspective-strength: 1200px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior: none;
            position: relative;
        }

        /* ================================================================
           PREMIUM AMBIENT BACKGROUND SYSTEM
           Multi-layered 3D atmospheric background with parallax
        ================================================================ */
        .ambient-layer {
            position: fixed;
            inset: -10%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            /* GPU acceleration */
            transform: translateZ(0);
            will-change: transform;
        }

        /* Deep ambient glow orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0;
            will-change: transform, opacity;
            transition: opacity 1.2s ease-out;
            /* Start invisible for fade-in */
            animation: orbAppear 2s ease-out forwards;
        }

        .orb-primary {
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle at 55% 45%, 
                rgba(88, 101, 242, 0.28) 0%, 
                rgba(88, 101, 242, 0.08) 40%, 
                transparent 70%
            );
            top: -20%;
            left: -15%;
            animation: orbAppear 2s ease-out 0.3s forwards,
                       orbFloat1 22s ease-in-out infinite alternate;
        }

        .orb-secondary {
            width: 850px;
            height: 850px;
            background: radial-gradient(circle at 40% 55%, 
                rgba(130, 140, 200, 0.2) 0%, 
                rgba(100, 110, 160, 0.06) 45%, 
                transparent 70%
            );
            bottom: -25%;
            right: -12%;
            animation: orbAppear 2s ease-out 0.6s forwards,
                       orbFloat2 26s ease-in-out 1s infinite alternate;
        }

        .orb-tertiary {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle at 50% 50%, 
                rgba(88, 101, 242, 0.16) 0%, 
                rgba(70, 80, 180, 0.05) 50%, 
                transparent 70%
            );
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbAppear 2s ease-out 0.9s forwards,
                       orbFloat3 28s ease-in-out 2s infinite alternate;
        }

        /* Subtle atmospheric particles layer */
        .particle-layer {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(1px 1px at 15% 25%, rgba(255, 255, 255, 0.08), transparent),
                radial-gradient(1px 1px at 75% 60%, rgba(255, 255, 255, 0.06), transparent),
                radial-gradient(1.5px 1.5px at 40% 80%, rgba(88, 101, 242, 0.10), transparent),
                radial-gradient(1px 1px at 85% 15%, rgba(255, 255, 255, 0.05), transparent),
                radial-gradient(1.5px 1.5px at 60% 35%, rgba(88, 101, 242, 0.08), transparent);
            opacity: 0.5;
            animation: particleShift 40s linear infinite;
        }

        @keyframes orbAppear {
            0% { opacity: 0; transform: translate(0, 0) scale(0.85); }
            100% { opacity: 1; transform: translate(0, 0) scale(1); }
        }

        @keyframes orbFloat1 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(2.5vw, 3vh) scale(1.08); }
            66% { transform: translate(-1.5vw, -2vh) scale(0.96); }
            100% { transform: translate(1vw, 1.5vh) scale(1.04); }
        }

        @keyframes orbFloat2 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-3vw, 2vh) scale(1.06); }
            66% { transform: translate(2vw, -2.5vh) scale(0.94); }
            100% { transform: translate(-1vw, 1vh) scale(1.03); }
        }

        @keyframes orbFloat3 {
            0% { transform: translate(-50%, -50%) scale(1); }
            33% { transform: translate(-48%, -52%) scale(1.10); }
            66% { transform: translate(-52%, -47%) scale(0.92); }
            100% { transform: translate(-49%, -51%) scale(1.05); }
        }

        @keyframes particleShift {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-1vw, 1vh); }
            50% { transform: translate(1vw, -0.5vh); }
            75% { transform: translate(-0.5vw, -1vh); }
            100% { transform: translate(0, 0); }
        }

        /* Grid overlay for depth perception */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.3;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        /* ================================================================
           MAIN APP CONTAINER
        ================================================================ */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 28px;
            gap: 28px;
            /* Fade in on load */
            animation: containerFadeIn 1s ease-out;
        }

        @keyframes containerFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ================================================================
           PREMIUM SIDEBAR — 3D Expandable Cards
        ================================================================ */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* 3D perspective context */
            perspective: var(--perspective-strength);
            animation: sidebarSlideIn 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }

        @keyframes sidebarSlideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Brand header */
        .sidebar-header {
            padding: 0 0 32px 0;
            margin-bottom: 8px;
            animation: headerFadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes headerFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar-header .brand-id {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--text-tertiary);
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .sidebar-header h1 {
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: -1.5px;
            line-height: 1;
            color: var(--text-primary);
            text-shadow: 0 0 40px rgba(88, 101, 242, 0.3);
        }

        /* ================================================================
           PREMIUM STAT CARDS — 3D Expandable with Mouse Proximity
        ================================================================ */
        .stat-card-wrapper {
            position: relative;
            /* Container for 3D transform */
            transform-style: preserve-3d;
            transition: var(--transition-smooth);
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 24px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            /* 3D transform properties */
            transform-style: preserve-3d;
            transform: translateZ(0) scale(1);
            transition: transform var(--transition-bounce),
                        border-color var(--transition-fast),
                        background var(--transition-fast),
                        box-shadow var(--transition-fast);
            /* Subtle inner highlight */
            box-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.03) inset,
                0 4px 20px rgba(0, 0, 0, 0.3);
            will-change: transform;
            /* Prevent text selection during interaction */
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Card shimmer effect */
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.02),
                transparent
            );
            transition: left 0.8s ease;
            z-index: 1;
            pointer-events: none;
        }

        .stat-card:hover::before {
            left: 150%;
        }

        /* Card expanded state (via JS class) */
        .stat-card.expanded {
            background: var(--surface-active);
            border-color: var(--border-hover);
            transform: translateZ(25px) scale(1.03);
            box-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.05) inset,
                0 8px 40px rgba(0, 0, 0, 0.5),
                0 0 60px var(--accent-soft);
            z-index: 5;
        }

        /* Hover glow ring */
        .stat-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            transition: border-color var(--transition-fast);
            z-index: 0;
            pointer-events: none;
        }

        .stat-card:hover::after,
        .stat-card.expanded::after {
            border-color: rgba(88, 101, 242, 0.2);
        }

        /* Card content layers */
        .stat-card > * {
            position: relative;
            z-index: 2;
        }

        .stat-card-label {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 400;
            transition: color var(--transition-fast);
        }

        .stat-card.expanded .stat-card-label {
            color: rgba(88, 101, 242, 0.8);
        }

        .stat-card-value {
            font-size: 52px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1;
            letter-spacing: -2.5px;
            transition: all var(--transition-fast);
            /* 3D text lift */
            transform: translateZ(5px);
        }

        .stat-card-value.accent { 
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .stat-card.expanded .stat-card-value {
            transform: translateZ(15px) scale(1.05);
        }

        .stat-card-detail {
            font-family: 'Space Mono', monospace;
            font-size: 8px;
            color: var(--text-tertiary);
            margin-top: 8px;
            letter-spacing: 1.5px;
            transition: color var(--transition-fast);
        }

        .stat-card.expanded .stat-card-detail {
            color: var(--text-secondary);
        }

        /* Active indicator dot */
        .stat-card-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0;
            transform: scale(0);
            transition: all var(--transition-bounce);
            box-shadow: 0 0 8px var(--accent-glow);
            z-index: 3;
        }

        .stat-card.expanded .stat-card-indicator {
            opacity: 1;
            transform: scale(1);
        }

        /* Card animation delays */
        .stat-card-wrapper:nth-child(2) .stat-card { animation: cardReveal 0.7s ease-out 0.3s both; }
        .stat-card-wrapper:nth-child(3) .stat-card { animation: cardReveal 0.7s ease-out 0.45s both; }
        .stat-card-wrapper:nth-child(4) .stat-card { animation: cardReveal 0.7s ease-out 0.6s both; }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(20px) translateZ(-20px); }
            to { opacity: 1; transform: translateY(0) translateZ(0); }
        }

        /* ================================================================
           MAIN CONTENT — Central Analytics Dashboard
        ================================================================ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            animation: contentFadeIn 1s ease-out 0.5s both;
            /* Custom scrollbar */
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.06) transparent;
            padding-right: 4px;
        }

        @keyframes contentFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-content::-webkit-scrollbar { 
            width: 4px; 
        }
        .main-content::-webkit-scrollbar-track { 
            background: transparent; 
            margin: 10px 0;
        }
        .main-content::-webkit-scrollbar-thumb { 
            background: rgba(255, 255, 255, 0.06); 
            border-radius: 10px;
            transition: background 0.3s;
        }
        .main-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        /* ================================================================
           TOP NAVIGATION
        ================================================================ */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 28px;
            align-items: center;
            padding: 0 0 8px 0;
            animation: navFadeIn 0.8s ease-out 0.5s both;
        }

        @keyframes navFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-nav a {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            color: var(--text-secondary);
            text-decoration: none;
            letter-spacing: 1.5px;
            transition: color var(--transition-fast);
            padding: 6px 0;
            position: relative;
            text-transform: uppercase;
        }

        .top-nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width var(--transition-fast);
        }

        .top-nav a:hover { 
            color: var(--text-primary); 
        }
        .top-nav a:hover::after {
            width: 100%;
        }

        .btn-logout {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            background: transparent;
            border: 1px solid rgba(231, 76, 60, 0.15);
            color: rgba(231, 76, 60, 0.65);
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: all var(--transition-fast);
            text-transform: uppercase;
        }
        .btn-logout:hover { 
            border-color: rgba(231, 76, 60, 0.4); 
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.05);
        }

        /* ================================================================
           ANALYTICS CHARTS GRID
        ================================================================ */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .chart-panel {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: border-color var(--transition-fast),
                        box-shadow var(--transition-fast);
            animation: chartReveal 0.8s ease-out both;
            /* Subtle inner glow at top */
            box-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.02) inset,
                0 4px 24px rgba(0, 0, 0, 0.25);
        }

        .chart-panel:hover {
            border-color: var(--border-medium);
            box-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.03) inset,
                0 6px 32px rgba(0, 0, 0, 0.35);
        }

        .chart-panel:nth-child(1) { animation-delay: 0.55s; }
        .chart-panel:nth-child(2) { animation-delay: 0.65s; }
        .chart-panel:nth-child(3) { animation-delay: 0.75s; }
        .chart-panel:nth-child(4) { animation-delay: 0.85s; }

        @keyframes chartReveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-panel h3 {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .chart-inner {
            min-height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Chart styling overrides */
        .chart-inner .recharts-cartesian-grid-horizontal line,
        .chart-inner .recharts-cartesian-grid-vertical line { 
            stroke: rgba(255, 255, 255, 0.03); 
        }
        .chart-inner .recharts-text { 
            fill: var(--text-tertiary); 
            font-size: 10px; 
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.5px;
        }
        .chart-inner .recharts-tooltip-wrapper {
            z-index: 100;
        }

        /* Loading state */
        .loading-pulse { 
            animation: pulse 2s ease-in-out infinite; 
            color: var(--text-tertiary); 
            font-family: 'Space Mono', monospace; 
            font-size: 10px; 
            letter-spacing: 1.5px; 
        }
        @keyframes pulse { 
            0%, 100% { opacity: 0.2; } 
            50% { opacity: 0.6; } 
        }

        /* ================================================================
           RESPONSIVE DESIGN
        ================================================================ */
        @media (max-width: 1200px) {
            .app-container {
                padding: 20px;
                gap: 20px;
            }
            .sidebar {
                width: 280px;
            }
            .stat-card-value {
                font-size: 42px;
            }
            .charts-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
        }

        @media (max-width: 1024px) {
            .app-container { 
                flex-direction: column; 
                overflow-y: auto;
                padding: 20px;
            }
            .sidebar { 
                width: 100%; 
                flex-direction: row; 
                flex-wrap: wrap; 
                gap: 12px;
                perspective: none;
            }
            .sidebar-header {
                width: 100%;
                padding-bottom: 16px;
            }
            .stat-card-wrapper {
                flex: 1;
                min-width: 140px;
            }
            .stat-card { 
                padding: 18px;
                transform: none !important;
            }
            .stat-card.expanded {
                transform: scale(1.02) !important;
            }
            .stat-card-value { 
                font-size: 32px; 
            }
            .charts-grid { 
                grid-template-columns: 1fr 1fr; 
            }
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 14px;
                gap: 14px;
            }
            .sidebar {
                gap: 8px;
            }
            .stat-card-wrapper {
                min-width: 100px;
            }
            .stat-card {
                padding: 14px;
            }
            .stat-card-value {
                font-size: 26px;
                letter-spacing: -1px;
            }
            .stat-card-label {
                font-size: 8px;
                letter-spacing: 1.5px;
            }
            .charts-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .chart-panel {
                padding: 16px;
            }
            .chart-panel h3 {
                font-size: 9px;
                margin-bottom: 14px;
            }
            .chart-inner {
                min-height: 160px;
            }
            .top-nav {
                gap: 16px;
                flex-wrap: wrap;
            }
            .sidebar-header h1 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 10px;
                gap: 10px;
            }
            .sidebar {
                gap: 6px;
            }
            .stat-card-wrapper {
                min-width: 80px;
                flex: 1 1 calc(50% - 6px);
            }
            .stat-card {
                padding: 12px;
                border-radius: var(--radius-sm);
            }
            .stat-card-value {
                font-size: 22px;
            }
            .stat-card-label {
                font-size: 7px;
                letter-spacing: 1px;
            }
            .stat-card-detail {
                font-size: 7px;
                margin-top: 4px;
            }
            .top-nav a,
            .btn-logout {
                font-size: 8px;
                padding: 6px 12px;
            }
        }

        /* ================================================================
           REDUCED MOTION SUPPORT
        ================================================================ */
        @media (prefers-reduced-motion: reduce) {
            .ambient-orb,
            .particle-layer {
                animation: none;
            }
            .stat-card,
            .stat-card-wrapper,
            .stat-card::before,
            .stat-card::after {
                transition: none;
                animation: none;
                transform: none !important;
            }
            .chart-panel,
            .sidebar,
            .main-content,
            .top-nav {
                animation: none;
            }
            .stat-card:hover,
            .stat-card.expanded {
                transform: none !important;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            }
        }
    </style>
</head>
<body>

    <!-- ================================================================
         PREMIUM 3D AMBIENT BACKGROUND
         Multi-layered parallax background system
    ================================================================ -->
    <div class="ambient-layer" id="ambientLayer">
        <div class="ambient-orb orb-primary" id="orb1"></div>
        <div class="ambient-orb orb-secondary" id="orb2"></div>
        <div class="ambient-orb orb-tertiary" id="orb3"></div>
        <div class="grid-overlay"></div>
        <div class="particle-layer"></div>
    </div>

    <!-- ================================================================
         MAIN APP CONTAINER
         Preserved all original IDs and structure
    ================================================================ -->
    <div class="app-container">

        <!-- ================================================================
             PREMIUM SIDEBAR — 3D Expandable Stat Cards
        ================================================================ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="brand-id">System Node: HV-DASH</span>
                <h1>HOST<br/>VILLE</h1>
            </div>

            <!-- Tickets Card -->
            <div class="stat-card-wrapper">

                    <div class="stat-card-indicator"></div>
                    <div class="stat-card-label">Active Tickets</div>
                    <div class="stat-card-value accent" id="tickets">-</div>
                    <div class="stat-card-detail">Open requests</div>
                </div>
            </div>

            <!-- Warns Card -->
            <div class="stat-card-wrapper">
                <div class="stat-card" data-card="warns" id="cardWarns">
                    <div class="stat-card-indicator"></div>
                    <div class="stat-card-label">Total Warns</div>
                    <div class="stat-card-value" id="warns">-</div>
                    <div class="stat-card-detail">Infractions logged</div>
                </div>
            </div>

            <!-- Pendings Card -->
            <div class="stat-card-wrapper">
                <div class="stat-card" data-card="pendings" id="cardPendings">
                    <div class="stat-card-indicator"></div>
                    <div class="stat-card-label">Pending Tasks</div>
                    <div class="stat-card-value" id="pendings">-</div>
                    <div class="stat-card-detail">Awaiting execution</div>

        <!-- ================================================================
             MAIN CONTENT — Central Analytics Dashboard
        ================================================================ -->
        <main class="main-content">
            <nav class="top-nav">
                <a href="/pendencias">Command Center</a>
                <a href="/credenciais">Credentials</a>
                <button class="btn-logout" onclick="logout()">Disconnect</button>
            </nav>

            <div class="charts-grid">
                <!-- Tickets Analytics -->
                <div class="chart-panel">
                    <h3>• Tickets Overview</h3>
                    <div class="chart-inner" id="chart-tickets">
                        <span class="loading-pulse">Loading…</span>
                    </div>
                </div>
                
                <!-- Warnings History -->
                <div class="chart-panel">
                    <h3>• Warnings History</h3>
                    <div class="chart-inner" id="chart-warns">
                        <span class="loading-pulse">Loading…</span>
                    </div>
                </div>
                
                <!-- Pending Tasks Analytics -->
                <div class="chart-panel">
                    <h3>• Pending Tasks</h3>
                    <div class="chart-inner" id="chart-pendings">
                        <span class="loading-pulse">Loading…</span>
                    </div>
                </div>
                
                <!-- System Activity -->
                <div class="chart-panel">
                    <h3>• System Activity</h3>

                        <span class="loading-pulse">Loading…</span>

    <!-- React + Recharts (preserved original dependencies) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
        // ================================================================
        // ORIGINAL AUTHENTICATION & CORE LOGIC — FULLY PRESERVED
        // ================================================================
        if (!localStorage.getItem('token')) window.location.href = '/';
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        // ================================================================
        // PREMIUM BACKGROUND PARALLAX SYSTEM
        // Multi-layered depth effect tied to mouse position
        // ================================================================
        const ambientOrbs = document.querySelectorAll('.ambient-orb');
        const gridOverlay = document.querySelector('.grid-overlay');
        const particleLayer = document.querySelector('.particle-layer');
        
        document.addEventListener('mousemove', (e) => {
            // Calculate normalized mouse position (-1 to 1)
            const mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            const mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            
            // Layer 1: Deep background orbs (slowest movement)
            if (ambientOrbs[0]) {
                ambientOrbs[0].style.transform = 
                    `translate(${mouseX * 18}px, ${mouseY * 18}px)`;
            }
            if (ambientOrbs[1]) {
                ambientOrbs[1].style.transform = 
                    `translate(${mouseX * -22}px, ${mouseY * -22}px)`;
            }
            if (ambientOrbs[2]) {
                ambientOrbs[2].style.transform = 
                    `translate(calc(-50% + ${mouseX * 12}px), calc(-50% + ${mouseY * 12}px))`;
            }
            
            // Layer 2: Grid overlay (medium movement)
            if (gridOverlay) {
                gridOverlay.style.transform = 
                    `translate(${mouseX * 6}px, ${mouseY * 6}px)`;
            }
            
            // Layer 3: Particles (fastest movement for depth)
            if (particleLayer) {
                particleLayer.style.transform = 
                    `translate(${mouseX * 4}px, ${mouseY * 4}px)`;
            }
        });

        // Also respond to device orientation on mobile
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null && e.beta !== null) {
                    const gamma = Math.max(-45, Math.min(45, e.gamma || 0)) / 45;
                    const beta = Math.max(-45, Math.min(45, e.beta || 0)) / 45;
                    
                    if (ambientOrbs[0]) {
                        ambientOrbs[0].style.transform = 
                            `translate(${gamma * 25}px, ${beta * 25}px)`;
                    }
                    if (ambientOrbs[1]) {
                        ambientOrbs[1].style.transform = 
                            `translate(${gamma * -30}px, ${beta * -30}px)`;
                    }
                }
            }, true);
        }

        // ================================================================
        // PREMIUM 3D CARD INTERACTION SYSTEM
        // Desktop: Mouse proximity expansion with 3D depth
        // Mobile: Touch-to-expand with toggle behavior
        // ================================================================
        const statCards = document.querySelectorAll('.stat-card');
        const sidebar = document.getElementById('sidebar');
        let activeMobileCard = null;

        // Detect if device supports hover (desktop vs mobile)
        const supportsHover = window.matchMedia('(hover: hover)').matches;
        
        if (supportsHover) {
            // ================================================================
            // DESKTOP: Mouse proximity 3D expansion
            // ================================================================
            statCards.forEach(card => {
                card.addEventListener('mouseenter', (e) => {
                    // Expand this card
                    card.classList.add('expanded');
                    apply3DTilt(card, e);
                });
                
                card.addEventListener('mousemove', (e) => {
                    if (card.classList.contains('expanded')) {
                        apply3DTilt(card, e);
                    }
                });
                
                card.addEventListener('mouseleave', () => {
                    card.classList.remove('expanded');
                    // Reset 3D transform
                    card.style.transform = 'translateZ(0) scale(1)';
                });
            });
            
            function apply3DTilt(card, event) {
                const rect = card.getBoundingClientRect();
                const cardCenterX = rect.left + rect.width / 2;
                const cardCenterY = rect.top + rect.height / 2;
                
                // Calculate mouse offset from card center (normalized -1 to 1)
                const offsetX = (event.clientX - cardCenterX) / (rect.width / 2);
                const offsetY = (event.clientY - cardCenterY) / (rect.height / 2);
                
                // Subtle 3D rotation (max 5 degrees) + expansion
                const rotateY = offsetX * 5;
                const rotateX = -offsetY * 5;
                
                card.style.transform = 
                    `perspective(var(--perspective-strength)) 
                     rotateY(${rotateY}deg) 
                     rotateX(${rotateX}deg) 
                     translateZ(25px) 
                     scale(1.03)`;
            }
            
        } else {
            // ================================================================
            // MOBILE: Touch-to-expand with toggle
            // ================================================================
            statCards.forEach(card => {
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    // If this card is already active, collapse it
                    if (card === activeMobileCard) {
                        card.classList.remove('expanded');
                        activeMobileCard = null;
                        return;
                    }
                    
                    // Collapse previously active card
                    if (activeMobileCard) {
                        activeMobileCard.classList.remove('expanded');
                    }
                    
                    // Expand this card
                    card.classList.add('expanded');
                    activeMobileCard = card;
                    
                    // Add subtle haptic feedback if available
                    if (navigator.vibrate) {
                        navigator.vibrate(10);
                    }
                });
            });
            
            // Click outside to collapse all cards
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.stat-card')) {
                    statCards.forEach(c => c.classList.remove('expanded'));
                    activeMobileCard = null;
                }
            });
        }

        // ================================================================
        // ORIGINAL DASHBOARD DATA LOADING — PRESERVED & ENHANCED
        // ================================================================
        async function loadDashboard() {
            try {
                const [statusRes, chartsRes] = await Promise.all([
                    fetch('/api/status', { 
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } 
                    }),
                    fetch('/api/dashboard/charts', { 
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } 
                    })
                ]);
                
                const statusData = await statusRes.json();
                const stats = statusData.stats || statusData;
                
                // Update stat cards with animation
                updateStatValue('tickets', stats.ticketsAtivos ?? 0);
                updateStatValue('warns', stats.warns ?? 0);
                updateStatValue('pendings', stats.pendentes ?? 0);

                let chartData;
                try { 
                    chartData = await chartsRes.json(); 
                } catch (e) { 
                    chartData = null; 
                }
                
                if (!chartData) {
                    chartData = {
                        tickets: { ativos: stats.ticketsAtivos || 0, fechados: 0, history: [] },
                        warns: { hoje: stats.warns || 0, semana: 0, history: [] },
                        pendings: { ativas: stats.pendentes || 0, concluidas: 0, history: [] },
                        activity: { mensagens: 0, comandos: 0 }
                    };
                }
                
                renderCharts(chartData);
                
            } catch (e) {
                console.error('Dashboard load error:', e);
                document.getElementById('tickets').textContent = '—';
                document.getElementById('warns').textContent = '—';
                document.getElementById('pendings').textContent = '—';
            }
        }

        // Smooth value update with count animation
        function updateStatValue(id, newValue) {
            const element = document.getElementById(id);
            const currentValue = parseInt(element.textContent) || 0;
            
            if (currentValue === newValue) {
                element.textContent = newValue;
                return;
            }
            
            // Animate number change
            const duration = 600;
            const startTime = performance.now();
            const startValue = currentValue;
            const change = newValue - startValue;
            
            function animateValue(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out cubic
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = Math.round(startValue + change * eased);
                
                element.textContent = current;
                
                if (progress < 1) {
                    requestAnimationFrame(animateValue);
                }
            }
            
            requestAnimationFrame(animateValue);
        }

        // ================================================================
        // PREMIUM CHART RENDERING — Clean, dark-themed, professional
        // ================================================================
        function renderCharts(d) {
            const { 
                BarChart, Bar, PieChart, Pie, Cell, LineChart, Line, 
                XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
                Legend, AreaChart, Area 
            } = Recharts;
            
            // Premium color palette
            const COLORS = {
                primary: '#5865F2',
                primarySoft: 'rgba(88, 101, 242, 0.5)',
                secondary: '#3c3c50',
                warning: '#e74c3c',
                warningSoft: 'rgba(231, 76, 60, 0.5)',
                success: '#2ecc71',
                successSoft: 'rgba(46, 204, 113, 0.5)',
                gridLine: 'rgba(255, 255, 255, 0.04)',
                tooltipBg: '#0e0e16',
                tooltipBorder: 'rgba(255, 255, 255, 0.08)'
            };

            // Shared tooltip style
            const tooltipStyle = {
                contentStyle: {
                    background: COLORS.tooltipBg,
                    border: `1px solid ${COLORS.tooltipBorder}`,
                    borderRadius: '6px',
                    fontSize: '11px',
                    fontFamily: "'Space Mono', monospace",
                    color: '#ffffff',
                    padding: '8px 12px',
                    boxShadow: '0 8px 24px rgba(0, 0, 0, 0.5)'
                }
            };

            // ================================================================
            // 1. TICKETS OVERVIEW — Bar Chart
            // ================================================================
            const ticketsData = [
                { name: 'Active', value: d.tickets.ativos || 0 },
                { name: 'Closed', value: d.tickets.fechados || 0 }
            ];

            ReactDOM.render(
                React.createElement(ResponsiveContainer, { width: '100%', height: 190 },
                    React.createElement(BarChart, { 
                        data: ticketsData,
                        margin: { top: 5, right: 10, left: 0, bottom: 5 }
                    },
                        React.createElement(CartesianGrid, { 
                            strokeDasharray: '3 3', 
                            stroke: COLORS.gridLine,
                            vertical: false 
                        }),
                        React.createElement(XAxis, { 
                            dataKey: 'name',
                            axisLine: false,
                            tickLine: false,
                            tick: { fill: 'rgba(255,255,255,0.3)', fontSize: 10 }
                        }),
                        React.createElement(YAxis, { 
                            axisLine: false,
                            tickLine: false,
                            tick: { fill: 'rgba(255,255,255,0.3)', fontSize: 10 }
                        }),
                        React.createElement(Tooltip, tooltipStyle),
                        React.createElement(Bar, { 
                            dataKey: 'value', 
                            fill: COLORS.primary,
                            radius: [3, 3, 0, 0],
                            maxBarSize: 60,
                            animationDuration: 1200,
                            animationEasing: 'ease-out'
                        })
                    )
                ), 
                document.getElementById('chart-tickets')
            );

            // ================================================================
            // 2. WARNINGS HISTORY — Area Chart with gradient
            // ================================================================
            const warnsHistoryData = d.warns.history && d.warns.history.length > 0 
                ? d.warns.history 
                : [
                    { name: 'Today', value: d.warns.hoje || 0 },
                    { name: 'This Week', value: d.warns.semana || 0 }
                ];

            ReactDOM.render(
                React.createElement(ResponsiveContainer, { width: '100%', height: 190 },
                    React.createElement(AreaChart, { 
                        data: warnsHistoryData,
                        margin: { top: 5, right: 10, left: 0, bottom: 5 }
                    },
                        React.createElement(defs, null,
                            React.createElement('linearGradient', { id: 'warnGradient', x1: '0', y1: '0', x2: '0', y2: '1' },
                                React.createElement('stop', { offset: '5%', stopColor: COLORS.warning, stopOpacity: 0.25 }),
                                React.createElement('stop', { offset: '95%', stopColor: COLORS.warning, stopOpacity: 0 })
                            )
                        ),
                        React.createElement(CartesianGrid, { 
                            strokeDasharray: '3 3', 
                            stroke: COLORS.gridLine,
                            vertical: false 
                        }),
                        React.createElement(XAxis, { 
                            dataKey: 'name',
                            axisLine: false,
                            tickLine: false,
                            tick: { fill: 'rgba(255,255,255,0.3)', fontSize: 10 }
                        }),
                        React.createElement(YAxis, { 
                            axisLine: false,
                            tickLine: false,
                            tick: { fill: 'rgba(255,255,255,0.3)', fontSize: 10 }
                        }),
                        React.createElement(Tooltip, tooltipStyle),
                        React.createElement(Area, {
                            type: 'monotone',
                            dataKey: 'value',
                            stroke: COLORS.warning,
                            strokeWidth: 2,
                            fill: 'url(#warnGradient)',
                            dot: { r: 3, fill: COLORS.warning, strokeWidth: 0 },
                            activeDot: { r: 5, fill: COLORS.warning, stroke: '#fff', strokeWidth: 2 },
                            animationDuration: 1500,
                            animationEasing: 'ease-out'
                        })
                    )
                ), 
                document.getElementById('chart-warns')
            );

            // ================================================================
            // 3. PENDING TASKS — Donut Chart
            // ================================================================
            const pendingData = [
                { name: 'Active', value: d.pendings.ativas || 0 },
                { name: 'Completed', value: d.pendings.concluidas || 0 }
            ];
            const pendingColors = [COLORS.primary, COLORS.success];

            ReactDOM.render(
                React.createElement(ResponsiveContainer, { width: '100%', height: 190 },
                    React.createElement(PieChart,
                        React.createElement(Pie, {
                            data: pendingData,
                            cx: '50%',
                            cy: '50%',
                            innerRadius: 40,
                            outerRadius: 70,
                            paddingAngle: 3,
                            dataKey: 'value',
                            stroke: 'none',
                            animationDuration: 1200,
                            animationEasing: 'ease-out'
                        },
                            pendingData.map((_, i) => 
                                React.createElement(Cell, { 
                                    key: i, 
                                    fill: pendingColors[i],
                                    stroke: 'rgba(0,0,0,0.3)',
                                    strokeWidth: 1
                                })
                            )
                        ),
                        React.createElement(Tooltip, tooltipStyle),
                        React.createElement(Legend, {
                            wrapperStyle: { 
                                fontSize: '9px', 
                                fontFamily: "'Space Mono', monospace",
                                color: 'rgba(255,255,255,0.5)',
                                paddingTop: '8px'
                            },
                            iconType: 'circle',
                            iconSize: 6
                        })
                    )
                ), 
                document.getElementById('chart-pendings')
            );

            // ================================================================
            // 4. SYSTEM ACTIVITY — Bar Chart
            // ================================================================
            const activityData = [
                { name: 'Messages', value: d.activity.mensagens || 0 },
                { name: 'Commands', value: d.activity.comandos || 0 }
            ];

            ReactDOM.render(
                React.createElement(ResponsiveContainer, { width: '100%', height: 190 },
                    React.createElement(BarChart, { 
                        data: activityData,
                        margin: { top: 5, right: 10, left: 0, bottom: 5 }
                    },
                        React.createElement(CartesianGrid, { 
                            strokeDasharray: '3 3', 
                            stroke: COLORS.gridLine,
                            vertical: false 
                        }),
                        React.createElement(XAxis, { 
                            dataKey: 'name',
                            axisLine: false,
                            tickLine: false,
                            tick: { fill: 'rgba(255,255,255,0.3)', fontSize: 10 }
                        }),
                        React.createElement(YAxis, { 
                            axisLine: false,
                            tickLine: false,
                            tick: { fill: 'rgba(255,255,255,0.3)', fontSize: 10 }
                        }),
                        React.createElement(Tooltip, tooltipStyle),
                        React.createElement(Bar, { 
                            dataKey: 'value', 
                            fill: COLORS.success,
                            radius: [3, 3, 0, 0],
                            maxBarSize: 60,
                            animationDuration: 1200,
                            animationEasing: 'ease-out'
                        })
                    )
                ), 
                document.getElementById('chart-activity')
            );
        }

        // ================================================================
        // ORIGINAL LOGOUT FUNCTION — PRESERVED
        // ================================================================
        window.logout = function () {
            localStorage.clear();
            window.location.href = "/";
                };

        // ================================================================
        // INITIALIZE DASHBOARD
        // ================================================================
        loadDashboard();
        
        // Auto-refresh every 30 seconds (preserved from original)
        setInterval(loadDashboard, 30000);

        // ================================================================
        // PERFORMANCE: Pause animations when tab is not visible
        // ================================================================
        document.addEventListener('visibilitychange', () => {
            const ambientLayer = document.getElementById('ambientLayer');
            if (ambientLayer) {
                if (document.hidden) {
                    ambientLayer.style.animationPlayState = 'paused';
                } else {
                    ambientLayer.style.animationPlayState = 'running';
                }
            }
        });

        console.log('%c HostVille Premium Dashboard %c v2.0 ',
            'background: #5865F2; color: #fff; padding: 4px 8px; border-radius: 3px 0 0 3px; font-family: monospace;',
            'background: #0e0e16; color: #fff; padding: 4px 8px; border-radius: 0 3px 3px 0; font-family: monospace;'
        );
    </script>
</body>
