<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostVille BOT - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --card: rgba(255,255,255,0.03);
            --card-hover: rgba(255,255,255,0.06);
            --accent-blue: rgba(88,101,242,0.6);
            --text: #ffffff;
            --text-dim: rgba(255,255,255,0.5);
            --text-tertiary: rgba(255,255,255,0.25);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease-out;
        }

        #loading-overlay canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loading-overlay .loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: 200;
            font-size: 2rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            user-select: none;
            font-family: 'Segoe UI', 'Helvetica Neue', 'Arial', sans-serif;
        }

        #loading-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #loading-overlay.hidden {
            display: none;
        }

        #dashboard {
            opacity: 0;
            transition: opacity 0.8s ease-in;
        }

        #dashboard.visible {
            opacity: 1;
        }

        .stage {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            will-change: transform;
            transform: translateZ(0);
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: rgba(130,140,255,0.35);
            left: -5%;
            top: -10%;
            animation: float1 20s ease-in-out infinite;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: rgba(255,255,255,0.2);
            left: 55%;
            top: -5%;
            animation: float2 25s ease-in-out infinite;
        }

        .blob-3 {
            width: 500px;
            height: 500px;
            background: rgba(130,140,255,0.25);
            left: 25%;
            top: 40%;
            animation: float3 30s ease-in-out infinite;
        }

        .blob-4 {
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.18);
            left: 70%;
            top: 35%;
            animation: float1 22s ease-in-out infinite reverse;
        }

        .blob-5 {
            width: 380px;
            height: 380px;
            background: rgba(130,140,255,0.3);
            left: 10%;
            top: 55%;
            animation: float2 28s ease-in-out infinite reverse;
        }

        .blob-6 {
            width: 250px;
            height: 250px;
            background: rgba(255,255,255,0.15);
            left: 45%;
            top: 0%;
            animation: float3 18s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(100px, -50px) scale(1.15);
            }
            50% {
                transform: translate(-40px, 80px) scale(0.9);
            }
            75% {
                transform: translate(-80px, -30px) scale(1.1);
            }
        }

        @keyframes float2 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(-60px, 60px) scale(1.2);
            }
            66% {
                transform: translate(50px, -80px) scale(0.85);
            }
        }

        @keyframes float3 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            20% {
                transform: translate(80px, 40px) scale(1.1);
            }
            40% {
                transform: translate(-50px, -60px) scale(0.9);
            }
            60% {
                transform: translate(30px, 80px) scale(1.15);
            }
            80% {
                transform: translate(-70px, -30px) scale(0.95);
            }
        }

        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            min-height: 100vh;
            width: 100vw;
            padding: 24px;
            gap: 24px;
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-header {
            padding: 0 0 28px 0;
        }

        .sidebar-header .brand-id {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-dim);
            display: block;
            margin-bottom: 6px;
        }

        .sidebar-header h1 {
            font-weight: 800;
            font-size: 1.6rem;
            line-height: 0.9;
            letter-spacing: -1.5px;
            color: var(--text);
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 24px;
            transition: all 0.5s cubic-bezier(0.25,0.8,0.25,1.2);
            cursor: default;
        }

        .stat-card:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateX(6px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .stat-card-label {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .stat-card-value {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
        }

        .stat-card-value.accent-blue {
            color: #5865F2;
        }

        .stat-card-value.accent-red {
            color: #ff6b6b;
        }

        .stat-card-value.accent-white {
            color: var(--text);
        }

        .stat-card-detail {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            color: var(--text-tertiary);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .main-content::-webkit-scrollbar {
            width: 3px;
        }

        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 24px;
            align-items: center;
            padding-bottom: 4px;
        }

        .top-nav a {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .top-nav a:hover {
            color: var(--text);
        }

        .btn-logout {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            border-color: rgba(255,107,107,0.5);
            color: #ff6b6b;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .chart-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .chart-panel:hover {
            border-color: var(--border-hover);
            background: var(--card-hover);
        }

        .chart-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .chart-panel h3 {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .chart-inner {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .loading-pulse {
            animation: pulse 2s ease-in-out infinite;
            color: var(--text-dim);
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.6;
            }
        }

        .line-chart-wrapper {
            width: 100%;
        }

        .line-chart {
            width: 100%;
            position: relative;
        }

        .line-chart svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .chart-legend {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.6);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            box-shadow: 0 0 12px currentColor;
        }

        .legend-value {
            color: rgba(255,255,255,0.9);
            font-weight: 600;
            margin-left: 4px;
        }

        .grid-line {
            stroke: rgba(255,255,255,0.06);
            stroke-width: 1;
        }

        .grid-line-vertical {
            stroke: rgba(255,255,255,0.04);
            stroke-width: 1;
            stroke-dasharray: 3,3;
        }

        .data-point {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .data-point:hover {
            filter: brightness(1.8);
        }

        .axis-label {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            fill: rgba(255,255,255,0.35);
        }

        .data-label {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            fill: rgba(255,255,255,0.8);
            font-weight: 600;
        }

        /* CONSOLE PANEL */
        .console-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .console-panel:hover {
            border-color: var(--border-hover);
            background: var(--card-hover);
        }

        .console-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(130,180,255,0.5), transparent);
        }

        .console-panel h3 {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .console-terminal {
            background: #0a0a0f;
            border: 1px solid rgba(130,180,255,0.2);
            border-radius: 10px;
            padding: 14px;
            min-height: 220px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 15px rgba(130,180,255,0.05);
        }

        .console-terminal::-webkit-scrollbar {
            width: 4px;
        }

        .console-terminal::-webkit-scrollbar-track {
            background: transparent;
        }

        .console-terminal::-webkit-scrollbar-thumb {
            background: rgba(130,180,255,0.15);
            border-radius: 10px;
        }

        .console-line {
            padding: 3px 8px;
            border-radius: 3px;
            display: flex;
            gap: 8px;
            align-items: center;
            animation: consoleFadeIn 0.2s ease-out;
            line-height: 1.6;
            min-height: 20px;
        }

        .console-line.welcome-line {
            background: rgba(130,180,255,0.06);
            border-left: 2px solid rgba(130,180,255,0.5);
            padding: 5px 10px;
            margin-bottom: 3px;
        }

        .console-prompt {
            color: rgba(130,180,255,0.6);
            white-space: nowrap;
            font-size: 10px;
            user-select: none;
            min-width: 12px;
        }

        .console-time {
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            min-width: 52px;
            font-size: 9px;
            user-select: none;
        }

        .console-tag {
            text-transform: uppercase;
            font-weight: 700;
            min-width: 62px;
            font-size: 8px;
            padding: 2px 5px;
            border-radius: 2px;
            text-align: center;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .console-tag.info { color: #82b4ff; background: rgba(130,180,255,0.1); }
        .console-tag.success { color: #7bed9f; background: rgba(123,237,159,0.1); }
        .console-tag.warn { color: #ffa502; background: rgba(255,165,2,0.1); }
        .console-tag.error { color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .console-tag.welcome { color: #82b4ff; background: rgba(130,180,255,0.12); }
        .console-tag.connected { color: #7bed9f; background: rgba(123,237,159,0.12); }

        .console-msg {
            color: rgba(220,225,240,0.8);
            word-break: break-all;
            font-size: 10px;
            flex: 1;
            line-height: 1.5;
        }

        .console-msg strong {
            color: #fff;
        }

        .console-placeholder {
            color: rgba(255,255,255,0.2);
            text-align: center;
            padding: 40px;
            font-size: 10px;
            font-family: 'Inter', sans-serif;
        }

        @keyframes consoleFadeIn {
            from {
                opacity: 0;
                transform: translateX(-6px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 1024px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
            }
            .stat-card {
                flex: 1;
                min-width: 120px;
                padding: 16px;
            }
            .stat-card-value {
                font-size: 28px;
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob {
                animation: none;
            }
            .stat-card:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <canvas id="loading-canvas"></canvas>
        <div class="loading-text" id="loading-text">LOADING</div>
    </div>

    <div id="dashboard">
        <div class="stage">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="blob blob-4"></div>
            <div class="blob blob-5"></div>
            <div class="blob blob-6"></div>
        </div>

        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span class="brand-id">System Node: HV-DASH</span>
                    <h1>HOST<br/>VILLE</h1>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Active Tickets</div>
                    <div class="stat-card-value accent-blue" id="tickets">-</div>
                    <div class="stat-card-detail">Open requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Total Warns</div>
                    <div class="stat-card-value accent-red" id="warns">-</div>
                    <div class="stat-card-detail">Infractions logged</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Pending Tasks</div>
                    <div class="stat-card-value accent-white" id="pendings">-</div>
                    <div class="stat-card-detail">Awaiting execution</div>
                </div>
            </aside>

            <main class="main-content">
                <nav class="top-nav">
                    <a href="/pendencias">Command Center</a>
                    <a href="/credenciais" id="navCredentials" style="display:none;">Credentials</a>
                    <button class="btn-logout" onclick="logout()">Disconnect</button>
                </nav>

                <div class="charts-grid" id="chartsGrid">
                    <div class="chart-panel">
                        <h3>Tickets Overview</h3>
                        <div class="chart-inner" id="chart-tickets">
                            <span class="loading-pulse">Loading…</span>
                        </div>
                    </div>
                    <div class="chart-panel">
                        <h3>Warnings History</h3>
                        <div class="chart-inner" id="chart-warns">
                            <span class="loading-pulse">Loading…</span>
                        </div>
                    </div>
                    <div class="chart-panel">
                        <h3>Pending Tasks</h3>
                        <div class="chart-inner" id="chart-pendings">
                            <span class="loading-pulse">Loading…</span>
                        </div>
                    </div>
                    <div class="console-panel">
                        <h3>🤖 Bot Console</h3>
                        <div class="console-terminal" id="bot-console">
                            <div class="console-placeholder">Aguardando conexão com o bot...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // =============================================
        // LOADING ANIMATION
        // =============================================
        class Vector2 {
            constructor(x, y) {
                this.x = x || 0;
                this.y = y || 0;
            }
        }

        class Vector3 {
            constructor(x, y, z) {
                this.x = x || 0;
                this.y = y || 0;
                this.z = z || 0;
            }

            clone() {
                return new Vector3(this.x, this.y, this.z);
            }

            add(v) {
                this.x += v.x;
                this.y += v.y;
                this.z += v.z;
                return this;
            }

            scale(s) {
                this.x *= s;
                this.y *= s;
                this.z *= s;
                return this;
            }
        }

        class Particle {
            constructor(baseX, baseY, baseZ, size) {
                this.basePosition = new Vector3(baseX, baseY, baseZ);
                this.position = new Vector3(baseX, baseY, baseZ);
                this.size = size;
                this.screenPos = new Vector2();
                this.projectedZ = 0;
            }

            reset() {
                this.position.x = this.basePosition.x;
                this.position.y = this.basePosition.y;
                this.position.z = this.basePosition.z;
            }
        }

        class Camera {
            constructor() {
                this.position = new Vector3(0, 0, 0);
                this.fov = 60;
                this.focalLength = 1.0 / Math.tan((this.fov * 0.5) * Math.PI / 180.0);
                this.near = 0.1;
                this.far = 1000;
            }

            project(point, screenWidth, screenHeight) {
                var camZ = this.position.z;
                var dx = point.x - this.position.x;
                var dy = point.y - this.position.y;
                var dz = point.z - camZ;

                if (dz < this.near) {
                    return null;
                }

                var scale = this.focalLength / dz;
                var screenX = dx * scale * (screenWidth / 2) + screenWidth / 2;
                var screenY = -dy * scale * (screenHeight / 2) + screenHeight / 2;

                return {
                    x: screenX,
                    y: screenY,
                    z: dz,
                    scale: scale
                };
            }

            moveForward(speed) {
                this.position.z += speed;
            }
        }

        class SpiralAnimation {
            constructor(canvas, loadingElement, onComplete) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.loadingElement = loadingElement;
                this.onComplete = onComplete;
                this.particles = [];
                this.camera = new Camera();
                this.animationId = null;
                this.animationStartTime = null;
                this.animationDuration = 5000;
                this.fadeOutDuration = 500;
                this.holdDuration = 200;
                this.totalDuration = this.animationDuration + this.holdDuration + this.fadeOutDuration;
                this.isFinished = false;
                this.fadeOutStartTime = null;
                this.holdStartTime = null;
                this.spiralLoops = 5;
                this.spiralRadius = 4.5;
                this.spiralHeight = 14.0;
                this.particleCount = 2500;
                this.baseSize = 2.0;
                this.sizeVariation = 0.8;
                this.textOpacity = 0;
                this.textFadeInDelay = 1200;
                this.textFadeInDuration = 700;
                this.initParticles();
                this.resize();
                this.setupEventListeners();
            }

            initParticles() {
                for (var i = 0; i < this.particleCount; i++) {
                    var t = i / (this.particleCount - 1);
                    var angle = t * Math.PI * 2 * this.spiralLoops;
                    var radiusVar = 0.3 * Math.sin(t * 30) + 0.2;
                    var radius = this.spiralRadius * (0.7 + t * 0.3) + (Math.random() - 0.5) * radiusVar;
                    var x = Math.cos(angle) * radius;
                    var y = Math.sin(angle) * radius;
                    var z = -t * this.spiralHeight + (Math.random() - 0.5) * 0.8;
                    var size = this.baseSize + (Math.random() - 0.5) * this.sizeVariation;
                    this.particles.push(new Particle(x, y, z, Math.max(0.6, size)));
                }
                this.camera.position.z = 2.5;
                this.initialCameraZ = this.camera.position.z;
                this.finalCameraZ = -this.spiralHeight - 2.0;
            }

            setupEventListeners() {
                var self = this;
                window.addEventListener('resize', function() {
                    self.resize();
                });
            }

            resize() {
                var dpr = window.devicePixelRatio || 1;
                var displayWidth = window.innerWidth;
                var displayHeight = window.innerHeight;
                this.canvas.width = displayWidth * dpr;
                this.canvas.height = displayHeight * dpr;
                this.canvas.style.width = displayWidth + 'px';
                this.canvas.style.height = displayHeight + 'px';
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.scale(dpr, dpr);
                this.displayWidth = displayWidth;
                this.displayHeight = displayHeight;
                this.centerX = displayWidth / 2;
                this.centerY = displayHeight / 2;
            }

            start() {
                if (this.animationId) {
                    return;
                }
                this.animationStartTime = performance.now();
                this.holdStartTime = null;
                this.fadeOutStartTime = null;
                this.isFinished = false;
                this.textOpacity = 0;
                this.loadingElement.style.opacity = '0';
                for (var i = 0; i < this.particles.length; i++) {
                    this.particles[i].reset();
                }
                this.camera.position.z = this.initialCameraZ;
                var self = this;
                this.animate(performance.now());
            }

            animate(timestamp) {
                if (this.isFinished) {
                    return;
                }
                var elapsed = timestamp - this.animationStartTime;

                if (elapsed < this.animationDuration) {
                    this.updateAnimation(elapsed / this.animationDuration);
                } else if (!this.holdStartTime) {
                    this.holdStartTime = timestamp;
                    this.updateAnimation(1.0);
                } else if (elapsed < this.animationDuration + this.holdDuration + this.fadeOutDuration) {
                    if (!this.fadeOutStartTime) {
                        this.fadeOutStartTime = timestamp;
                    }
                    var fadeElapsed = timestamp - this.fadeOutStartTime;
                    var fadeProgress = Math.min(1.0, fadeElapsed / this.fadeOutDuration);
                    var easedFade = this.easeInOutQuad(fadeProgress);
                    var canvasOpacity = 1.0 - easedFade;
                    var textOpacity = Math.max(0, this.textOpacity - easedFade);
                    this.ctx.clearRect(0, 0, this.displayWidth, this.displayHeight);
                    if (canvasOpacity > 0.01) {
                        this.ctx.globalAlpha = canvasOpacity;
                        this.renderParticles(1.0);
                        this.ctx.globalAlpha = 1.0;
                    }
                    this.loadingElement.style.opacity = textOpacity;
                } else {
                    this.finish();
                    return;
                }

                if (elapsed < this.animationDuration + this.holdDuration) {
                    this.updateText(elapsed);
                }

                var self = this;
                this.animationId = requestAnimationFrame(function(ts) {
                    self.animate(ts);
                });
            }

            updateAnimation(progress) {
                var easedProgress = this.easeInOutCubic(progress);
                var targetZ = this.initialCameraZ + (this.finalCameraZ - this.initialCameraZ) * easedProgress;
                this.camera.position.z = targetZ;
                var expansionFactor = 1.0 + progress * 0.5;
                for (var i = 0; i < this.particles.length; i++) {
                    this.particles[i].position.x = this.particles[i].basePosition.x * expansionFactor;
                    this.particles[i].position.y = this.particles[i].basePosition.y * expansionFactor;
                    this.particles[i].position.z = this.particles[i].basePosition.z;
                }
                this.ctx.clearRect(0, 0, this.displayWidth, this.displayHeight);
                this.ctx.globalAlpha = 1.0;
                this.renderParticles(progress);
            }

            renderParticles(progress) {
                var ctx = this.ctx;
                var particles = this.particles;
                var cam = this.camera;
                var w = this.displayWidth;
                var h = this.displayHeight;
                var projectedParticles = [];

                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    var projected = cam.project(p.position, w, h);
                    if (projected) {
                        projectedParticles.push({
                            x: projected.x,
                            y: projected.y,
                            z: projected.z,
                            size: p.size * projected.scale * 0.9,
                            originalSize: p.size
                        });
                    }
                }

                projectedParticles.sort(function(a, b) {
                    return b.z - a.z;
                });

                for (var i = 0; i < projectedParticles.length; i++) {
                    var p = projectedParticles[i];
                    var depthFade = Math.min(1.0, Math.max(0.2, 1.0 - (p.z / 18.0)));
                    var brightness = 0.7 + (p.originalSize / (this.baseSize + this.sizeVariation)) * 0.3;
                    var alpha = depthFade * brightness * 0.9;
                    ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(0.4, p.size * 0.5), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            updateText(elapsed) {
                if (elapsed >= this.textFadeInDelay) {
                    var fadeProgress = Math.min(1.0, (elapsed - this.textFadeInDelay) / this.textFadeInDuration);
                    var easedFade = this.easeInOutQuad(fadeProgress);
                    var breathPeriod = 3200;
                    var breathPhase = (elapsed - this.textFadeInDelay) / breathPeriod;
                    var breath = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(breathPhase * Math.PI * 2));
                    this.textOpacity = easedFade * breath;
                    this.loadingElement.style.opacity = this.textOpacity;
                }
            }

            finish() {
                this.isFinished = true;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                this.ctx.clearRect(0, 0, this.displayWidth, this.displayHeight);
                this.loadingElement.style.opacity = '0';

                var overlay = document.getElementById('loading-overlay');
                overlay.classList.add('fade-out');
                var self = this;
                setTimeout(function() {
                    overlay.classList.add('hidden');
                    document.getElementById('dashboard').classList.add('visible');
                    if (self.onComplete) {
                        self.onComplete();
                    }
                }, 600);
            }

            easeInOutQuad(t) {
                return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
            }

            easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
            }
        }

        // =============================================
        // DASHBOARD FUNCTIONS

        var dashboardLoaded = false;

        function getUserRoleFromToken() {
            var token = localStorage.getItem('token');
            if (!token) return 'tester';
            try {
                var parts = token.split('.');
                if (parts.length !== 3) return 'tester';
                var payload = parts[1];
                payload = payload.replace(/-/g, '+').replace(/_/g, '/');
                while (payload.length % 4 !== 0) payload += '=';
                var decoded = atob(payload);
                var data = JSON.parse(decoded);
                return data.role || 'tester';
            } catch (e) {
                return 'tester';
            }
        }

        function getUserNameFromToken() {
            var token = localStorage.getItem('token');
            if (!token) return 'User';
            try {
                var parts = token.split('.');
                if (parts.length !== 3) return 'User';
                var payload = parts[1];
                payload = payload.replace(/-/g, '+').replace(/_/g, '/');
                while (payload.length % 4 !== 0) payload += '=';
                var decoded = atob(payload);
                var data = JSON.parse(decoded);
                return data.user || 'User';
            } catch (e) {
                return 'User';
            }
        }

        var userRole = getUserRoleFromToken();
        var userName = getUserNameFromToken();

        function initDashboard() {
            if (dashboardLoaded) {
                return;
            }
            dashboardLoaded = true;

            if (!localStorage.getItem('token')) {
                window.location.href = '/';
                return;
            }

            if (userRole === 'full') {
                document.getElementById('navCredentials').style.display = '';
            }

            var blobs = document.querySelectorAll('.blob');
            document.addEventListener('mousemove', function(e) {

                blobs.forEach(function(b, i) {
                    b.style.transform = 'translate(' + x * (i + 1) * 10 + 'px, ' + y * (i + 1) * 10 + 'px)';
                });
            });

            loadDashboardData();
            setInterval(loadDashboardData, 30000);

            initBotConsole();
        }

        // =============================================
        // BOT CONSOLE EM TEMPO REAL (PUSHER) COM ARMAZENAMENTO LOCAL
        // =============================================
        function initBotConsole() {
            var consoleDiv = document.getElementById('bot-console');
            var maxLogs = 80;
            var STORAGE_KEY = 'hostville_console_logs';

            function loadSavedLogs() {
                try {
                    var saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        return JSON.parse(saved);
                    }
                } catch (e) {}
                return [];
            }

            function saveLogs(logs) {
                try {
                    var toSave = logs.slice(0, maxLogs);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                } catch (e) {}
            }

            var consoleLogs = loadSavedLogs();

            function addConsoleLine(time, tag, msg, extraClass) {
                var line = document.createElement('div');
                line.className = 'console-line';
                if (extraClass) line.classList.add(extraClass);
                line.innerHTML = '<span class="console-prompt">❯</span>' +
                    '<span class="console-time">' + time + '</span>' +
                    '<span class="console-tag ' + tag.toLowerCase() + '">' + tag + '</span>' +
                    '<span class="console-msg">' + msg + '</span>';
                return line;
            }

            function renderAllLogs() {
                consoleDiv.innerHTML = '';

                // Mensagem de boas-vindas sempre no topo
                var now = new Date().toLocaleTimeString('pt-BR');
                var welcomeLine = addConsoleLine(now, 'WELCOME', '👋 Hello <strong>' + userName + '</strong>, your role is <strong>' + userRole.toUpperCase() + '</strong>', 'welcome-line');
                consoleDiv.appendChild(welcomeLine);

                // Logs normais (mais recentes primeiro)
                for (var i = 0; i < consoleLogs.length; i++) {
                    var log = consoleLogs[i];
                    consoleDiv.appendChild(addConsoleLine(log.time, log.tag, log.msg));
                }

                if (consoleLogs.length === 0) {
                    var infoLine = addConsoleLine(now, 'INFO', '⏳ Connecting to bot realtime...');
                    consoleDiv.appendChild(infoLine);
                }

                consoleDiv.scrollTop = 0;
            }

            function addNewLog(time, tag, msg) {
                // Remove CONNECTED antigo se existir
                consoleLogs = consoleLogs.filter(function(log) {
                    return log.tag !== 'CONNECTED';
                });

                // Adiciona no topo
                consoleLogs.unshift({
                    time: time,
                    tag: tag,
                    msg: msg
                });

                if (consoleLogs.length > maxLogs) {
                    consoleLogs = consoleLogs.slice(0, maxLogs);
                }

                saveLogs(consoleLogs);
                renderAllLogs();
            }

            renderAllLogs();

            fetch('/api/pusher-key')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var pusherKey = data.key;
                    if (!pusherKey) {
                        throw new Error('Key not found');
                    }

                    var pusher = new Pusher(pusherKey, {
                        cluster: 'us2'
                    });

                    var channel = pusher.subscribe('bot-logs');

                    channel.bind('new-log', function(data) {
                        var time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('pt-BR') : new Date().toLocaleTimeString('pt-BR');
                        var type = data.type || 'INFO';
                        var msg = data.message || '';

                        addNewLog(time, type.toUpperCase(), msg);
                    });

                    channel.bind('pusher:subscription_succeeded', function() {
                        var now = new Date().toLocaleTimeString('pt-BR');
                        addNewLog(now, 'CONNECTED', '✅ Connected to bot realtime stream');
                    });

                    channel.bind('pusher:subscription_error', function() {
                        var now = new Date().toLocaleTimeString('pt-BR');
                        addNewLog(now, 'ERROR', '❌ Failed to connect to bot stream');
                    });

                })
                .catch(function(e) {
                    var now = new Date().toLocaleTimeString('pt-BR');
                    var hasError = false;
                    for (var i = 0; i < consoleLogs.length; i++) {
                        if (consoleLogs[i].msg.indexOf('Pusher key') > -1) {
                            hasError = true;
                            break;
                        }
                    }
                    if (!hasError) {
                        addNewLog(now, 'ERROR', '❌ Pusher key not configured on server');
                    }
                });
        }

        function createLineChart(containerId, data, colors) {
            var container = document.getElementById(containerId);
            if (!container) {
                return;
            }

            var width = container.offsetWidth || 500;
            var height = 220;
            var padding = { top: 25, right: 30, bottom: 40, left: 45 };
            var chartWidth = width - padding.left - padding.right;
            var chartHeight = height - padding.top - padding.bottom;

            var allValues = [];
            data.forEach(function(series) {
                allValues = allValues.concat(series.data);
            });
            var maxValue = Math.max.apply(null, allValues.length > 0 ? allValues : [1]);
            var minValue = 0;
            maxValue = Math.ceil(maxValue / 5) * 5;
            if (maxValue === 0) {
                maxValue = 5;
            }
            var valueRange = maxValue - minValue;

            var svgNS = "http://www.w3.org/2000/svg";
            var svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 " + width + " " + height);
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

            var gridLines = 5;
            for (var i = 0; i <= gridLines; i++) {
                var y = padding.top + (chartHeight / gridLines) * i;

                var gridLine = document.createElementNS(svgNS, "line");
                gridLine.setAttribute("x1", padding.left);
                gridLine.setAttribute("y1", y);
                gridLine.setAttribute("x2", width - padding.right);
                gridLine.setAttribute("y2", y);
                gridLine.setAttribute("class", "grid-line");
                svg.appendChild(gridLine);

                var label = document.createElementNS(svgNS, "text");
                label.setAttribute("x", padding.left - 10);
                label.setAttribute("y", y + 4);
                label.setAttribute("text-anchor", "end");
                label.setAttribute("class", "axis-label");
                label.textContent = Math.round(maxValue - (valueRange / gridLines) * i);
                svg.appendChild(label);
            }

            if (data[0] && data[0].data.length > 1) {
                var numPoints = data[0].data.length;
                for (var i = 0; i < numPoints; i++) {
                    var x = padding.left + (chartWidth / (numPoints - 1)) * i;
                    var vLine = document.createElementNS(svgNS, "line");
                    vLine.setAttribute("x1", x);
                    vLine.setAttribute("y1", padding.top);
                    vLine.setAttribute("x2", x);
                    vLine.setAttribute("y2", padding.top + chartHeight);
                    vLine.setAttribute("class", "grid-line-vertical");
                    svg.appendChild(vLine);
                }
            }

            data.forEach(function(series, seriesIndex) {
                var points = series.data.map(function(value, index) {
                    var x = padding.left + (chartWidth / (series.data.length - 1 || 1)) * index;
                    var y = padding.top + chartHeight - ((value - minValue) / valueRange) * chartHeight;
                    return { x: x, y: y, value: value };
                });

                var gradientId = 'gradient-' + containerId + '-' + seriesIndex;
                var defs = document.createElementNS(svgNS, "defs");
                var gradient = document.createElementNS(svgNS, "linearGradient");
                gradient.setAttribute("id", gradientId);
                gradient.setAttribute("x1", "0");
                gradient.setAttribute("y1", "0");
                gradient.setAttribute("x2", "0");
                gradient.setAttribute("y2", "1");

                var stop1 = document.createElementNS(svgNS, "stop");
                stop1.setAttribute("offset", "0%");
                stop1.setAttribute("stop-color", colors[seriesIndex]);
                stop1.setAttribute("stop-opacity", "0.35");

                var stop2 = document.createElementNS(svgNS, "stop");
                stop2.setAttribute("offset", "100%");
                stop2.setAttribute("stop-color", colors[seriesIndex]);
                stop2.setAttribute("stop-opacity", "0.02");

                gradient.appendChild(stop1);
                gradient.appendChild(stop2);
                defs.appendChild(gradient);
                svg.appendChild(defs);

                var d = '';
                points.forEach(function(p, i) {
                    if (i === 0) {
                        d += 'M ' + p.x + ',' + p.y;
                    } else {
                        var prev = points[i - 1];
                        var cp1x = prev.x + (p.x - prev.x) / 3;
                        var cp2x = p.x - (p.x - prev.x) / 3;
                        d += ' C ' + cp1x + ',' + prev.y + ' ' + cp2x + ',' + p.y + ' ' + p.x + ',' + p.y;
                    }
                });

                var areaPath = document.createElementNS(svgNS, "path");
                var areaD = d + ' L ' + points[points.length - 1].x + ',' + (padding.top + chartHeight) +
                    ' L ' + points[0].x + ',' + (padding.top + chartHeight) + ' Z';
                areaPath.setAttribute("d", areaD);
                areaPath.setAttribute("fill", 'url(#' + gradientId + ')');
                areaPath.style.animation = 'fadeInUp 1s ease-out';
                svg.appendChild(areaPath);

                var linePath = document.createElementNS(svgNS, "path");
                linePath.setAttribute("d", d);
                linePath.setAttribute("fill", "none");
                linePath.setAttribute("stroke", colors[seriesIndex]);
                linePath.setAttribute("stroke-width", "2.5");
                linePath.setAttribute("stroke-linecap", "round");
                linePath.setAttribute("stroke-linejoin", "round");
                linePath.style.filter = 'drop-shadow(0 0 8px ' + colors[seriesIndex] + ')';
                svg.appendChild(linePath);

                points.forEach(function(point) {
                    var glow = document.createElementNS(svgNS, "circle");
                    glow.setAttribute("cx", point.x);
                    glow.setAttribute("cy", point.y);
                    glow.setAttribute("r", "8");
                    glow.setAttribute("fill", "none");
                    glow.setAttribute("stroke", colors[seriesIndex]);
                    glow.setAttribute("stroke-width", "1");
                    glow.setAttribute("opacity", "0.3");
                    svg.appendChild(glow);

                    var circle = document.createElementNS(svgNS, "circle");
                    circle.setAttribute("cx", point.x);
                    circle.setAttribute("cy", point.y);
                    circle.setAttribute("r", "4.5");
                    circle.setAttribute("fill", "#000");
                    circle.setAttribute("stroke", colors[seriesIndex]);
                    circle.setAttribute("stroke-width", "2.5");
                    circle.setAttribute("class", "data-point");
                    circle.style.filter = 'drop-shadow(0 0 6px ' + colors[seriesIndex] + ')';

                    var title = document.createElementNS(svgNS, "title");
                    title.textContent = series.name + ': ' + point.value;
                    circle.appendChild(title);
                    svg.appendChild(circle);

                    var valueLabel = document.createElementNS(svgNS, "text");
                    valueLabel.setAttribute("x", point.x);
                    valueLabel.setAttribute("y", point.y - 12);
                    valueLabel.setAttribute("text-anchor", "middle");
                    valueLabel.setAttribute("class", "data-label");
                    valueLabel.setAttribute("fill", colors[seriesIndex]);
                    valueLabel.textContent = point.value;
                    svg.appendChild(valueLabel);
                });
            });

            if (data[0] && data[0].labels) {
                data[0].labels.forEach(function(label, index) {
                    var x = padding.left + (chartWidth / (data[0].labels.length - 1 || 1)) * index;
                    var text = document.createElementNS(svgNS, "text");
                    text.setAttribute("x", x);
                    text.setAttribute("y", padding.top + chartHeight + 20);
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("class", "axis-label");
                    text.textContent = label;
                    svg.appendChild(text);
                });
            }

            container.innerHTML = '';

            var wrapper = document.createElement('div');
            wrapper.className = 'line-chart-wrapper';

            var chartDiv = document.createElement('div');
            chartDiv.className = 'line-chart';
            chartDiv.appendChild(svg);
            wrapper.appendChild(chartDiv);

            var legendDiv = document.createElement('div');
            legendDiv.className = 'chart-legend';
            data.forEach(function(series, index) {
                var legendItem = document.createElement('div');
                legendItem.className = 'legend-item';

                var dot = document.createElement('div');
                dot.className = 'legend-dot';
                dot.style.backgroundColor = colors[index];
                dot.style.color = colors[index];

                var span = document.createElement('span');
                span.textContent = series.name;

                var value = document.createElement('span');
                value.className = 'legend-value';
                value.textContent = series.data[series.data.length - 1] || 0;

                legendItem.appendChild(dot);
                legendItem.appendChild(span);
                legendItem.appendChild(value);
                legendDiv.appendChild(legendItem);
            });
            wrapper.appendChild(legendDiv);

            container.appendChild(wrapper);
        }

        function renderCharts(d) {
            var ticketsHistory = d.tickets?.historico || [];
            var ticketsActiveData, ticketsClosedData, ticketsLabels;
            if (ticketsHistory.length > 0) {
                ticketsActiveData = ticketsHistory.map(function(h) { return h.ativos || 0; });
                ticketsClosedData = ticketsHistory.map(function(h) { return h.fechados || 0; });
                ticketsLabels = ticketsHistory.map(function(h) { return h.data || ''; });
            } else {
                var ativos = d.tickets?.ativos || 0;
                var fechados = d.tickets?.fechados || 0;
                ticketsActiveData = [Math.max(0, ativos - 2), ativos];
                ticketsClosedData = [Math.max(0, fechados - 3), fechados];
                ticketsLabels = ['Ant', 'Atual'];
            }
            createLineChart('chart-tickets', [{ name: 'Active', data: ticketsActiveData, labels: ticketsLabels }, { name: 'Closed', data: ticketsClosedData, labels: ticketsLabels }], ['#5865F2', 'rgba(88,101,242,0.4)']);

            var warnsHistory = d.warns?.historico || [];
            var warnsTodayData, warnsWeekData, warnsLabels;
            if (warnsHistory.length > 0) {
                warnsTodayData = warnsHistory.map(function(h) { return h.hoje || 0; });
                warnsWeekData = warnsHistory.map(function(h) { return h.semana || 0; });
                warnsLabels = warnsHistory.map(function(h) { return h.data || ''; });
            } else {
                var hoje = d.warns?.hoje || 0;
                var semana = d.warns?.semana || 0;
                warnsTodayData = [Math.max(0, hoje - 1), hoje];
                warnsWeekData = [Math.max(0, semana - 2), semana];
                warnsLabels = ['Ant', 'Atual'];
            }
            createLineChart('chart-warns', [{ name: 'Today', data: warnsTodayData, labels: warnsLabels }, { name: 'Week', data: warnsWeekData, labels: warnsLabels }], ['#ff6b6b', 'rgba(255,107,107,0.4)']);

            var pendingsHistory = d.pendings?.historico || [];
            var pendingsActiveData, pendingsDoneData, pendingsLabels;
            if (pendingsHistory.length > 0) {
                pendingsActiveData = pendingsHistory.map(function(h) { return h.ativas || 0; });
                pendingsDoneData = pendingsHistory.map(function(h) { return h.concluidas || 0; });
                pendingsLabels = pendingsHistory.map(function(h) { return h.data || ''; });
            } else {
                var ativas = d.pendings?.ativas || 0;
                var concluidas = d.pendings?.concluidas || 0;
                pendingsActiveData = [Math.max(0, ativas - 1), ativas];
                pendingsDoneData = [Math.max(0, concluidas - 2), concluidas];
                pendingsLabels = ['Ant', 'Atual'];
            }
            createLineChart('chart-pendings', [{ name: 'Active', data: pendingsActiveData, labels: pendingsLabels }, { name: 'Done', data: pendingsDoneData, labels: pendingsLabels }], ['#ffffff', 'rgba(255,255,255,0.4)']);
        }

        window.logout = function() {
            localStorage.clear();
            window.location.href = '/';
        };

        document.addEventListener('DOMContentLoaded', function() {
            var canvas = document.getElementById('loading-canvas');
            var loadingElement = document.getElementById('loading-text');
            if (!canvas || !loadingElement) {
                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('dashboard').classList.add('visible');
                initDashboard();
                return;
            }
            var animation = new SpiralAnimation(canvas, loadingElement, initDashboard);
            animation.start();
        });

    })();
    </script>
</body>
</html>
