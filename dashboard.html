<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostVille BOT - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: rgba(255,255,255,0.03);
            --card-hover: rgba(255,255,255,0.06);
            --accent: #ffffff;
            --accent-blue: rgba(88,101,242,0.6);
            --text: #ffffff;
            --text-dim: rgba(255,255,255,0.5);
            --text-tertiary: rgba(255,255,255,0.25);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .stage {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            will-change: transform;
            transform: translateZ(0);
        }

        .blob-1 { width:400px; height:400px; background:rgba(88,101,242,0.3); left:-5%; top:-10%; animation:float1 20s ease-in-out infinite; }
        .blob-2 { width:350px; height:350px; background:rgba(255,255,255,0.15); left:55%; top:-5%; animation:float2 25s ease-in-out infinite; }
        .blob-3 { width:500px; height:500px; background:rgba(88,101,242,0.2); left:25%; top:40%; animation:float3 30s ease-in-out infinite; }
        .blob-4 { width:300px; height:300px; background:rgba(255,255,255,0.12); left:70%; top:35%; animation:float1 22s ease-in-out infinite reverse; }
        .blob-5 { width:380px; height:380px; background:rgba(88,101,242,0.25); left:10%; top:55%; animation:float2 28s ease-in-out infinite reverse; }
        .blob-6 { width:250px; height:250px; background:rgba(255,255,255,0.1); left:45%; top:0%; animation:float3 18s ease-in-out infinite; }

        @keyframes float1 {
            0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(100px,-50px) scale(1.15)} 50%{transform:translate(-40px,80px) scale(0.9)} 75%{transform:translate(-80px,-30px) scale(1.1)}
        }
        @keyframes float2 {
            0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-60px,60px) scale(1.2)} 66%{transform:translate(50px,-80px) scale(0.85)}
        }
        @keyframes float3 {
            0%,100%{transform:translate(0,0) scale(1)} 20%{transform:translate(80px,40px) scale(1.1)} 40%{transform:translate(-50px,-60px) scale(0.9)} 60%{transform:translate(30px,80px) scale(1.15)} 80%{transform:translate(-70px,-30px) scale(0.95)}
        }

        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 24px;
            gap: 24px;
        }

        .sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
        .sidebar-header { padding: 0 0 28px 0; }

        .sidebar-header .brand-id {
            font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 4px;
            text-transform: uppercase; color: var(--text-dim); display: block; margin-bottom: 6px;
        }

        .sidebar-header h1 { font-weight: 800; font-size: 1.6rem; line-height: 0.9; letter-spacing: -1.5px; color: var(--text); }

        .stat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 22px 24px; transition: all 0.5s cubic-bezier(0.25,0.8,0.25,1.2); cursor: default;
        }
        .stat-card:hover { background: var(--card-hover); border-color: var(--border-hover); transform: translateX(6px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }

        .stat-card-label {
            font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text-dim); margin-bottom: 10px;
        }

        .stat-card-value { font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
        .stat-card-value.accent-blue { color: var(--accent-blue); }
        .stat-card-value.accent-red { color: #ff6b6b; }
        .stat-card-value.accent-white { color: var(--text); }

        .stat-card-detail {
            font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-tertiary);
            margin-top: 6px; letter-spacing: 1px;
        }

        .main-content { flex: 1; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        .main-content::-webkit-scrollbar { width: 3px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 10px; }

        .top-nav { display: flex; justify-content: flex-end; gap: 24px; align-items: center; padding-bottom: 4px; }
        .top-nav a {
            font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim);
            text-decoration: none; letter-spacing: 2px; text-transform: uppercase; transition: color 0.3s;
        }
        .top-nav a:hover { color: var(--text); }

        .btn-logout {
            font-family: 'Space Mono', monospace; font-size: 10px; background: transparent;
            border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 8px 18px;
            border-radius: 25px; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; transition: all 0.3s;
        }
        .btn-logout:hover { border-color: rgba(255,107,107,0.5); color: #ff6b6b; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .chart-panel {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px 22px; transition: all 0.3s;
        }
        .chart-panel:hover { border-color: var(--border-hover); background: var(--card-hover); }

        .chart-panel h3 {
            font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text-dim); margin-bottom: 14px;
        }

        .chart-inner { min-height: 160px; display: flex; align-items: center; justify-content: center; }

        .loading-pulse { animation: pulse 2s ease-in-out infinite; color: var(--text-dim); font-family: 'Space Mono', monospace; font-size: 10px; }
        @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.6} }

        /* Simple bar styles */
        .simple-chart { display: flex; gap: 8px; align-items: flex-end; height: 100%; width: 100%; padding: 10px 0; }
        .bar-container { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
        .bar-wrapper { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
        .bar { width: 40px; border-radius: 4px 4px 0 0; transition: height 0.8s cubic-bezier(0.25,0.8,0.25,1); position: relative; min-height: 4px; }
        .bar.accent-blue { background: rgba(88,101,242,0.6); }
        .bar.accent-red { background: #ff6b6b; }
        .bar.accent-white { background: rgba(255,255,255,0.8); }
        .bar-label { font-family: 'Space Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.4); text-align: center; }
        .bar-value { font-family: 'Space Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.7); }

        @media (max-width: 1024px) {
            .app-container { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 8px; }
            .stat-card { flex: 1; min-width: 120px; padding: 16px; }
            .stat-card-value { font-size: 28px; }
            .charts-grid { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none; }
            .stat-card:hover { transform: none; }
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
        <div class="blob blob-6"></div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-id">System Node: HV-DASH</span>
                <h1>HOST<br/>VILLE</h1>
            </div>
            <div class="stat-card">
                <div class="stat-card-label">Active Tickets</div>
                <div class="stat-card-value accent-blue" id="tickets">-</div>
                <div class="stat-card-detail">Open requests</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-label">Total Warns</div>
                <div class="stat-card-value accent-red" id="warns">-</div>
                <div class="stat-card-detail">Infractions logged</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-label">Pending Tasks</div>
                <div class="stat-card-value accent-white" id="pendings">-</div>
                <div class="stat-card-detail">Awaiting execution</div>
            </div>
        </aside>

        <main class="main-content">
            <nav class="top-nav">
                <a href="/pendencias">Command Center</a>
                <a href="/credenciais">Credentials</a>
                <button class="btn-logout" onclick="logout()">Disconnect</button>
            </nav>

            <div class="charts-grid">
                <div class="chart-panel">
                    <h3>• Tickets Overview</h3>
                    <div class="chart-inner" id="chart-tickets"><span class="loading-pulse">Loading…</span></div>
                </div>
                <div class="chart-panel">
                    <h3>• Warnings History</h3>
                    <div class="chart-inner" id="chart-warns"><span class="loading-pulse">Loading…</span></div>
                </div>
                <div class="chart-panel">
                    <h3>• Pending Tasks</h3>
                    <div class="chart-inner" id="chart-pendings"><span class="loading-pulse">Loading…</span></div>
                </div>
                <div class="chart-panel">
                    <h3>• System Activity</h3>
                    <div class="chart-inner" id="chart-activity"><span class="loading-pulse">Loading…</span></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        if (!localStorage.getItem('token')) window.location.href = '/';

        var blobs = document.querySelectorAll('.blob');
        document.addEventListener('mousemove', function(e) {
            var x = (e.clientX / window.innerWidth - 0.5) * 2;
            var y = (e.clientY / window.innerHeight - 0.5) * 2;
            blobs.forEach(function(b, i) { b.style.transform = 'translate(' + x*(i+1)*10 + 'px, ' + y*(i+1)*10 + 'px)'; });
        });

        function createSimpleBarChart(data, containerId, barColor) {
            var container = document.getElementById(containerId);
            if (!container) return;
            
            var maxValue = Math.max(...data.map(d => d.value), 1);
            var chartDiv = document.createElement('div');
            chartDiv.className = 'simple-chart';
            
            data.forEach(function(item) {
                var barContainer = document.createElement('div');
                barContainer.className = 'bar-container';
                
                var barValue = document.createElement('div');
                barValue.className = 'bar-value';
                barValue.textContent = item.value;
                
                var barWrapper = document.createElement('div');
                barWrapper.className = 'bar-wrapper';
                
                var bar = document.createElement('div');
                bar.className = 'bar ' + barColor;
                bar.style.height = (item.value / maxValue * 100) + '%';
                
                var barLabel = document.createElement('div');
                barLabel.className = 'bar-label';
                barLabel.textContent = item.name;
                
                barWrapper.appendChild(bar);
                barContainer.appendChild(barValue);
                barContainer.appendChild(barWrapper);
                barContainer.appendChild(barLabel);
                chartDiv.appendChild(barContainer);
            });
            
            container.innerHTML = '';
            container.appendChild(chartDiv);
        }

        function createDonutChart(data, containerId) {
            var container = document.getElementById(containerId);
            if (!container) return;
            
            var total = data.reduce((sum, item) => sum + item.value, 0);
            var colors = ['rgba(255,255,255,0.8)', 'rgba(88,101,242,0.6)'];
            
            var chartDiv = document.createElement('div');
            chartDiv.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:20px;width:100%;';
            
            // Simple SVG donut
            var svgNS = "http://www.w3.org/2000/svg";
            var svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", "120");
            svg.setAttribute("height", "120");
            svg.setAttribute("viewBox", "0 0 120 120");
            
            var circumference = 2 * Math.PI * 45;
            var offset = circumference;
            
            data.forEach(function(item, index) {
                if (total === 0) return;
                var percentage = item.value / total;
                var dashLength = circumference * percentage;
                
                var circle = document.createElementNS(svgNS, "circle");
                circle.setAttribute("cx", "60");
                circle.setAttribute("cy", "60");
                circle.setAttribute("r", "45");
                circle.setAttribute("fill", "none");
                circle.setAttribute("stroke", colors[index]);
                circle.setAttribute("stroke-width", "8");
                circle.setAttribute("stroke-dasharray", dashLength + " " + (circumference - dashLength));
                circle.setAttribute("stroke-dashoffset", offset);
                circle.setAttribute("stroke-linecap", "round");
                circle.style.transition = "all 1s ease";
                
                offset -= dashLength;
                svg.appendChild(circle);
            });
            
            // Center text
            var text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", "60");
            text.setAttribute("y", "60");
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("dominant-baseline", "middle");
            text.setAttribute("fill", "white");
            text.setAttribute("font-size", "24");
            text.setAttribute("font-weight", "bold");
            text.setAttribute("font-family", "Inter, sans-serif");
            text.textContent = total;
            svg.appendChild(text);
            
            chartDiv.appendChild(svg);
            
            // Legend
            var legendDiv = document.createElement('div');
            legendDiv.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
            
            data.forEach(function(item, index) {
                var legendItem = document.createElement('div');
                legendItem.style.cssText = 'display:flex;align-items:center;gap:8px;font-family:"Space Mono",monospace;font-size:10px;color:rgba(255,255,255,0.6);';
                
                var colorDot = document.createElement('div');
                colorDot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:' + colors[index] + ';';
                
                legendItem.appendChild(colorDot);
                legendItem.appendChild(document.createTextNode(item.name + ': ' + item.value));
                legendDiv.appendChild(legendItem);
            });
            
            chartDiv.appendChild(legendDiv);
            container.innerHTML = '';
            container.appendChild(chartDiv);
        }

        async function load() {
            try {
                var sr = await fetch('/api/status', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } });
                var cr = await fetch('/api/dashboard/charts', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } });
                var sd = await sr.json(); var s = sd.stats || sd;
                document.getElementById('tickets').textContent = s.ticketsAtivos || 0;
                document.getElementById('warns').textContent = s.warns || 0;
                document.getElementById('pendings').textContent = s.pendentes || 0;

                var cd;
                try { cd = await cr.json(); } catch (e) {
                    cd = { 
                        tickets: { ativos: s.ticketsAtivos||0, fechados:0 }, 
                        warns: { hoje:s.warns||0, semana:0 }, 
                        pendings: { ativas:s.pendentes||0, concluidas:0 }, 
                        activity: { mensagens:0, comandos:0 } 
                    };
                }
                renderCharts(cd);
            } catch (e) {
                console.error('Error loading data:', e);
                document.getElementById('tickets').textContent = '—';
                document.getElementById('warns').textContent = '—';
                document.getElementById('pendings').textContent = '—';
            }
        }

        function renderCharts(d) {
            // Tickets bar chart
            createSimpleBarChart([
                {name: 'Active', value: d.tickets.ativos || 0},
                {name: 'Closed', value: d.tickets.fechados || 0}
            ], 'chart-tickets', 'accent-blue');
            
            // Warns bar chart
            createSimpleBarChart([
                {name: 'Today', value: d.warns.hoje || 0},
                {name: 'Week', value: d.warns.semana || 0}
            ], 'chart-warns', 'accent-red');
            
            // Pending tasks donut
            createDonutChart([
                {name: 'Active', value: d.pendings.ativas || 0},
                {name: 'Done', value: d.pendings.concluidas || 0}
            ], 'chart-pendings');
            
            // Activity bar chart
            createSimpleBarChart([
                {name: 'Msgs', value: d.activity.mensagens || 0},
                {name: 'Cmds', value: d.activity.comandos || 0}
            ], 'chart-activity', 'accent-white');
        }

        window.logout = function() { localStorage.clear(); window.location.href = '/'; };

        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
