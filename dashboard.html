<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostVille BOT - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: rgba(255,255,255,0.03);
            --card-hover: rgba(255,255,255,0.06);
            --accent: #ffffff;
            --accent-blue: rgba(88,101,242,0.6);
            --text: #ffffff;
            --text-dim: rgba(255,255,255,0.5);
            --text-tertiary: rgba(255,255,255,0.25);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* LOADING SCREEN - Full screen overlay */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease-out;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #loading-screen.hidden {
            display: none;
        }

        #loading-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #welcome-text {
            position: relative;
            z-index: 1;
            color: white;
            font-weight: 200;
            font-size: 2rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            font-family: 'Segoe UI', 'Helvetica Neue', 'Arial', sans-serif;
        }

        /* STAGE BACKGROUND */
        .stage {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            will-change: transform;
            transform: translateZ(0);
        }

        .blob-1 { width:400px; height:400px; background:rgba(88,101,242,0.3); left:-5%; top:-10%; animation:float1 20s ease-in-out infinite; }
        .blob-2 { width:350px; height:350px; background:rgba(255,255,255,0.15); left:55%; top:-5%; animation:float2 25s ease-in-out infinite; }
        .blob-3 { width:500px; height:500px; background:rgba(88,101,242,0.2); left:25%; top:40%; animation:float3 30s ease-in-out infinite; }
        .blob-4 { width:300px; height:300px; background:rgba(255,255,255,0.12); left:70%; top:35%; animation:float1 22s ease-in-out infinite reverse; }
        .blob-5 { width:380px; height:380px; background:rgba(88,101,242,0.25); left:10%; top:55%; animation:float2 28s ease-in-out infinite reverse; }
        .blob-6 { width:250px; height:250px; background:rgba(255,255,255,0.1); left:45%; top:0%; animation:float3 18s ease-in-out infinite; }

        @keyframes float1 {
            0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(100px,-50px) scale(1.15)} 50%{transform:translate(-40px,80px) scale(0.9)} 75%{transform:translate(-80px,-30px) scale(1.1)}
        }
        @keyframes float2 {
            0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-60px,60px) scale(1.2)} 66%{transform:translate(50px,-80px) scale(0.85)}
        }
        @keyframes float3 {
            0%,100%{transform:translate(0,0) scale(1)} 20%{transform:translate(80px,40px) scale(1.1)} 40%{transform:translate(-50px,-60px) scale(0.9)} 60%{transform:translate(30px,80px) scale(1.15)} 80%{transform:translate(-70px,-30px) scale(0.95)}
        }

        /* DASHBOARD */
        #dashboard {
            position: relative;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }

        #dashboard.visible {
            opacity: 1;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            width: 100vw;
            padding: 24px;
            gap: 24px;
        }

        .sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
        .sidebar-header { padding: 0 0 28px 0; }

        .sidebar-header .brand-id {
            font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 4px;
            text-transform: uppercase; color: var(--text-dim); display: block; margin-bottom: 6px;
        }

        .sidebar-header h1 { font-weight: 800; font-size: 1.6rem; line-height: 0.9; letter-spacing: -1.5px; color: var(--text); }

        .stat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 22px 24px; transition: all 0.5s cubic-bezier(0.25,0.8,0.25,1.2); cursor: default;
        }
        .stat-card:hover { background: var(--card-hover); border-color: var(--border-hover); transform: translateX(6px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }

        .stat-card-label {
            font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text-dim); margin-bottom: 10px;
        }

        .stat-card-value { font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
        .stat-card-value.accent-blue { color: var(--accent-blue); }
        .stat-card-value.accent-red { color: #ff6b6b; }
        .stat-card-value.accent-white { color: var(--text); }

        .stat-card-detail {
            font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-tertiary);
            margin-top: 6px; letter-spacing: 1px;
        }

        .main-content { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .main-content::-webkit-scrollbar { width: 3px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 10px; }

        .top-nav { display: flex; justify-content: flex-end; gap: 24px; align-items: center; padding-bottom: 4px; }
        .top-nav a {
            font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim);
            text-decoration: none; letter-spacing: 2px; text-transform: uppercase; transition: color 0.3s;
        }
        .top-nav a:hover { color: var(--text); }

        .btn-logout {
            font-family: 'Space Mono', monospace; font-size: 10px; background: transparent;
            border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 8px 18px;
            border-radius: 25px; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; transition: all 0.3s;
        }
        .btn-logout:hover { border-color: rgba(255,107,107,0.5); color: #ff6b6b; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .chart-panel {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px 22px; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .chart-panel:hover { border-color: var(--border-hover); background: var(--card-hover); }
        .chart-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .chart-panel h3 {
            font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text-dim); margin-bottom: 14px;
        }

        .chart-inner { 
            min-height: 180px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative;
        }

        .loading-pulse { 
            animation: pulse 2s ease-in-out infinite; 
            color: var(--text-dim); 
            font-family: 'Space Mono', monospace; 
            font-size: 10px; 
            letter-spacing: 1px;
        }
        @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.6} }

        /* Estilos para gráficos de linha */
        .line-chart {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .line-chart svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .chart-legend {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            color: rgba(255,255,255,0.5);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .grid-line {
            stroke: rgba(255,255,255,0.04);
            stroke-width: 1;
        }

        .data-point {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .data-point:hover {
            filter: brightness(1.5);
        }

        @media (max-width: 1024px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 8px; }
            .stat-card { flex: 1; min-width: 120px; padding: 16px; }
            .stat-card-value { font-size: 28px; }
            .charts-grid { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none; }
            .stat-card:hover { transform: none; }
        }
    </style>
</head>
<body>

    <!-- ===== LOADING SCREEN (ANIMAÇÃO INICIAL) ===== -->
    <div id="loading-screen">
        <canvas id="loading-canvas"></canvas>
        <div id="welcome-text">WELCOME</div>
    </div>
    <!-- ===== FIM DO LOADING SCREEN ===== -->

    <!-- ===== DASHBOARD (INICIALMENTE INVISÍVEL) ===== -->
    <div id="dashboard">
        <div class="stage">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="blob blob-4"></div>
            <div class="blob blob-5"></div>
            <div class="blob blob-6"></div>
        </div>

        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span class="brand-id">System Node: HV-DASH</span>

                </div>
                <div class="stat-card">

            <main class="main-content">

                <div class="charts-grid">

                        <div class="chart-inner" id="chart-warns"><span class="loading-pulse">Loading…</span></div>
                    </div>
                    <div class="chart-panel">
                        <h3>• Pending Tasks</h3>
                        <div class="chart-inner" id="chart-pendings"><span class="loading-pulse">Loading…</span></div>
                    </div>
                    <div class="chart-panel">

                        <div class="chart-inner" id="chart-activity"><span class="loading-pulse">Loading…</span></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <!-- ===== FIM DA DASHBOARD ===== -->

    <script>
        // ===== ANIMAÇÃO DE LOADING =====
        class Vector2 {
            constructor(x = 0, y = 0) {
                this.x = x;
                this.y = y;
            }
            clone() {
                return new Vector2(this.x, this.y);
            }
        }

        class Vector3 {
            constructor(x = 0, y = 0, z = 0) {
                this.x = x;
                this.y = y;
                this.z = z;
            }
            clone() {
                return new Vector3(this.x, this.y, this.z);
            }
            add(v) {
                this.x += v.x;
                this.y += v.y;
                this.z += v.z;
                return this;
            }
            scale(s) {
                this.x *= s;
                this.y *= s;
                this.z *= s;
                return this;
            }
        }

        class Particle {
            constructor(baseX, baseY, baseZ, size) {
                this.basePosition = new Vector3(baseX, baseY, baseZ);
                this.position = new Vector3(baseX, baseY, baseZ);
                this.size = size;
                this.screenPos = new Vector2();
                this.projectedZ = 0;
            }
            reset() {
                this.position.x = this.basePosition.x;
                this.position.y = this.basePosition.y;
                this.position.z = this.basePosition.z;
            }
        }

        class Camera {
            constructor() {
                this.position = new Vector3(0, 0, 0);
                this.fov = 60;
                this.focalLength = 1.0 / Math.tan((this.fov * 0.5) * Math.PI / 180.0);
                this.near = 0.1;
                this.far = 1000;
            }
            project(point, screenWidth, screenHeight) {
                const camZ = this.position.z;
                const dx = point.x - this.position.x;
                const dy = point.y - this.position.y;
                const dz = point.z - camZ;
                if (dz < this.near) return null;
                const scale = this.focalLength / dz;
                const screenX = dx * scale * (screenWidth / 2) + screenWidth / 2;
                const screenY = -dy * scale * (screenHeight / 2) + screenHeight / 2;
                return { x: screenX, y: screenY, z: dz, scale: scale };
            }
            moveForward(speed) {
                this.position.z += speed;
            }
        }

        class SpiralAnimation {
            constructor(canvas, welcomeElement) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.welcomeElement = welcomeElement;
                this.particles = [];
                this.camera = new Camera();
                this.animationId = null;
                this.animationStartTime = null;
                this.animationDuration = 6000;
                this.fadeOutDuration = 600;
                this.holdDuration = 300;
                this.totalDuration = this.animationDuration + this.holdDuration + this.fadeOutDuration;
                this.isFinished = false;
                this.fadeOutStartTime = null;
                this.holdStartTime = null;
                this.spiralLoops = 6;
                this.spiralRadius = 4.5;
                this.spiralHeight = 14.0;
                this.particleCount = 2800;
                this.baseSize = 1.8;
                this.sizeVariation = 0.7;
                this.textOpacity = 0;
                this.textFadeInDelay = 1500;
                this.textFadeInDuration = 800;
                this.initParticles();
                this.resize();
                this.setupEventListeners();
            }

            initParticles() {
                for (let i = 0; i < this.particleCount; i++) {
                    const t = i / (this.particleCount - 1);
                    const angle = t * Math.PI * 2 * this.spiralLoops;
                    const radiusVar = 0.3 * Math.sin(t * 30) + 0.2;
                    const radius = this.spiralRadius * (0.7 + t * 0.3) + (Math.random() - 0.5) * radiusVar;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    const z = -t * this.spiralHeight + (Math.random() - 0.5) * 0.8;
                    const size = this.baseSize + (Math.random() - 0.5) * this.sizeVariation;
                    this.particles.push(new Particle(x, y, z, Math.max(0.6, size)));
                }
                this.camera.position.z = 2.5;
                this.initialCameraZ = this.camera.position.z;
                this.finalCameraZ = -this.spiralHeight - 2.0;
            }

            setupEventListeners() {
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const dpr = window.devicePixelRatio || 1;
                const displayWidth = window.innerWidth;
                const displayHeight = window.innerHeight;
                this.canvas.width = displayWidth * dpr;
                this.canvas.height = displayHeight * dpr;
                this.canvas.style.width = displayWidth + 'px';
                this.canvas.style.height = displayHeight + 'px';
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.scale(dpr, dpr);
                this.displayWidth = displayWidth;
                this.displayHeight = displayHeight;
                this.centerX = displayWidth / 2;
                this.centerY = displayHeight / 2;
            }

            start() {
                if (this.animationId) return;
                this.animationStartTime = performance.now();
                this.holdStartTime = null;
                this.fadeOutStartTime = null;
                this.isFinished = false;
                this.textOpacity = 0;
                this.welcomeElement.style.opacity = '0';
                this.particles.forEach(p => p.reset());
                this.camera.position.z = this.initialCameraZ;
                this.animate(performance.now());
            }

            animate(timestamp) {
                if (this.isFinished) return;
                const elapsed = timestamp - this.animationStartTime;

                if (elapsed < this.animationDuration) {
                    this.updateAnimation(elapsed / this.animationDuration);
                } else if (!this.holdStartTime) {
                    this.holdStartTime = timestamp;
                    this.updateAnimation(1.0);
                } else if (elapsed < this.animationDuration + this.holdDuration + this.fadeOutDuration) {
                    if (!this.fadeOutStartTime) {
                        this.fadeOutStartTime = timestamp;
                    }
                    const fadeElapsed = timestamp - this.fadeOutStartTime;
                    const fadeProgress = Math.min(1.0, fadeElapsed / this.fadeOutDuration);
                    const easedFade = this.easeInOutQuad(fadeProgress);
                    const canvasOpacity = 1.0 - easedFade;
                    const textOpacity = Math.max(0, this.textOpacity - easedFade);
                    
                    this.ctx.clearRect(0, 0, this.displayWidth, this.displayHeight);
                    if (canvasOpacity > 0.01) {
                        this.ctx.globalAlpha = canvasOpacity;
                        this.renderParticles(1.0);
                        this.ctx.globalAlpha = 1.0;
                    }
                    this.welcomeElement.style.opacity = textOpacity;
                } else {
                    this.finish();
                    return;
                }

                if (elapsed < this.animationDuration + this.holdDuration) {
                    this.updateText(elapsed);
                }

                this.animationId = requestAnimationFrame((t) => this.animate(t));
            }

            updateAnimation(progress) {
                const easedProgress = this.easeInOutCubic(progress);
                const targetZ = this.initialCameraZ + (this.finalCameraZ - this.initialCameraZ) * easedProgress;
                this.camera.position.z = targetZ;
                const expansionFactor = 1.0 + progress * 0.5;
                
                this.particles.forEach(p => {
                    p.position.x = p.basePosition.x * expansionFactor;
                    p.position.y = p.basePosition.y * expansionFactor;
                    p.position.z = p.basePosition.z;
                });

                this.ctx.clearRect(0, 0, this.displayWidth, this.displayHeight);
                this.ctx.globalAlpha = 1.0;
                this.renderParticles(progress);
            }

            renderParticles(progress) {
                const ctx = this.ctx;
                const particles = this.particles;
                const cam = this.camera;
                const w = this.displayWidth;
                const h = this.displayHeight;

                const projectedParticles = [];
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    const projected = cam.project(p.position, w, h);
                    if (projected) {
                        projectedParticles.push({
                            x: projected.x,
                            y: projected.y,
                            z: projected.z,
                            size: p.size * projected.scale * 0.9,
                            originalSize: p.size
                        });
                    }
                }

                projectedParticles.sort((a, b) => b.z - a.z);

                for (let i = 0; i < projectedParticles.length; i++) {
                    const p = projectedParticles[i];
                    const depthFade = Math.min(1.0, Math.max(0.2, 1.0 - (p.z / 18.0)));
                    const brightness = 0.7 + (p.originalSize / (this.baseSize + this.sizeVariation)) * 0.3;
                    const alpha = depthFade * brightness * 0.9;
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(0.4, p.size * 0.5), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            updateText(elapsed) {
                if (elapsed >= this.textFadeInDelay) {
                    const fadeProgress = Math.min(1.0, (elapsed - this.textFadeInDelay) / this.textFadeInDuration);
                    const easedFade = this.easeInOutQuad(fadeProgress);
                    const breathPeriod = 3200;
                    const breathPhase = (elapsed - this.textFadeInDelay) / breathPeriod;
                    const breath = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(breathPhase * Math.PI * 2));
                    this.textOpacity = easedFade * breath;
                    this.welcomeElement.style.opacity = this.textOpacity;
                }
            }

            finish() {
                this.isFinished = true;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                this.ctx.clearRect(0, 0, this.displayWidth, this.displayHeight);
                this.welcomeElement.style.opacity = '0';
                showDashboard();
            }

            easeInOutQuad(t) {
                return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
            }

            easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
            }
        }

        function showDashboard() {
            const loadingScreen = document.getElementById('loading-screen');
            const dashboard = document.getElementById('dashboard');
            
            loadingScreen.classList.add('fade-out');
            
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                dashboard.classList.add('visible');
                loadDashboard();
            }, 600);
        }

        // ===== DASHBOARD SCRIPTS =====
        if (!localStorage.getItem('token')) window.location.href = '/';

        var blobs = document.querySelectorAll('.blob');
        document.addEventListener('mousemove', function(e) {
            var x = (e.clientX / window.innerWidth - 0.5) * 2;
            var y = (e.clientY / window.innerHeight - 0.5) * 2;
            blobs.forEach(function(b, i) { 
                b.style.transform = 'translate(' + x*(i+1)*10 + 'px, ' + y*(i+1)*10 + 'px)'; 
            });
        });

        function createLineChart(containerId, data, colors) {
            var container = document.getElementById(containerId);
            if (!container) return;

            var width = container.offsetWidth || 400;
            var height = 180;
            var padding = { top: 20, right: 20, bottom: 30, left: 40 };
            var chartWidth = width - padding.left - padding.right;
            var chartHeight = height - padding.top - padding.bottom;

            var allValues = data.flatMap(function(series) { return series.data; });
            var maxValue = Math.max.apply(null, allValues.length > 0 ? allValues : [1]);
            var minValue = Math.min.apply(null, allValues.length > 0 ? allValues : [0]);
            var valueRange = maxValue - minValue || 1;

            var svgNS = "http://www.w3.org/2000/svg";
            var svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 " + width + " " + height);
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

            var gridLines = 4;
            for (var i = 0; i <= gridLines; i++) {
                var y = padding.top + (chartHeight / gridLines) * i;
                var gridLine = document.createElementNS(svgNS, "line");
                gridLine.setAttribute("x1", padding.left);
                gridLine.setAttribute("y1", y);
                gridLine.setAttribute("x2", width - padding.right);
                gridLine.setAttribute("y2", y);
                gridLine.setAttribute("class", "grid-line");
                svg.appendChild(gridLine);

                var label = document.createElementNS(svgNS, "text");
                label.setAttribute("x", padding.left - 8);
                label.setAttribute("y", y + 4);
                label.setAttribute("text-anchor", "end");
                label.setAttribute("fill", "rgba(255,255,255,0.2)");
                label.setAttribute("font-size", "8");
                label.setAttribute("font-family", "Space Mono, monospace");
                label.textContent = Math.round(maxValue - (valueRange / gridLines) * i);
                svg.appendChild(label);
            }

            data.forEach(function(series, seriesIndex) {
                var points = series.data.map(function(value, index) {
                    var x = padding.left + (chartWidth / (series.data.length - 1 || 1)) * index;
                    var y = padding.top + chartHeight - ((value - minValue) / valueRange) * chartHeight;
                    return { x: x, y: y, value: value };
                });

                var gradientId = 'gradient-' + containerId + '-' + seriesIndex;
                var defs = document.createElementNS(svgNS, "defs");
                var gradient = document.createElementNS(svgNS, "linearGradient");
                gradient.setAttribute("id", gradientId);
                gradient.setAttribute("x1", "0");
                gradient.setAttribute("y1", "0");
                gradient.setAttribute("x2", "0");
                gradient.setAttribute("y2", "1");

                var stop1 = document.createElementNS(svgNS, "stop");
                stop1.setAttribute("offset", "0%");
                stop1.setAttribute("stop-color", colors[seriesIndex]);
                stop1.setAttribute("stop-opacity", "0.3");

                var stop2 = document.createElementNS(svgNS, "stop");
                stop2.setAttribute("offset", "100%");
                stop2.setAttribute("stop-color", colors[seriesIndex]);
                stop2.setAttribute("stop-opacity", "0.02");

                gradient.appendChild(stop1);
                gradient.appendChild(stop2);
                defs.appendChild(gradient);
                svg.appendChild(defs);

                var linePath = document.createElementNS(svgNS, "path");
                var d = points.map(function(p, i) {
                    return (i === 0 ? 'M' : 'L') + ' ' + p.x + ',' + p.y;
                }).join(' ');
                linePath.setAttribute("d", d);
                linePath.setAttribute("fill", "none");
                linePath.setAttribute("stroke", colors[seriesIndex]);
                linePath.setAttribute("stroke-width", "2");
                linePath.setAttribute("stroke-linecap", "round");
                linePath.setAttribute("stroke-linejoin", "round");
                linePath.style.filter = 'drop-shadow(0 0 6px ' + colors[seriesIndex] + ')';
                svg.appendChild(linePath);

                var areaPath = document.createElementNS(svgNS, "path");
                var areaD = d + ' L ' + points[points.length - 1].x + ',' + (padding.top + chartHeight) + 
                           ' L ' + points[0].x + ',' + (padding.top + chartHeight) + ' Z';
                areaPath.setAttribute("d", areaD);
                areaPath.setAttribute("fill", 'url(#' + gradientId + ')');
                svg.appendChild(areaPath);

                points.forEach(function(point) {
                    var circle = document.createElementNS(svgNS, "circle");
                    circle.setAttribute("cx", point.x);
                    circle.setAttribute("cy", point.y);
                    circle.setAttribute("r", "4");
                    circle.setAttribute("fill", colors[seriesIndex]);
                    circle.setAttribute("stroke", "#000");
                    circle.setAttribute("stroke-width", "1.5");
                    circle.setAttribute("class", "data-point");
                    circle.style.filter = 'drop-shadow(0 0 4px ' + colors[seriesIndex] + ')';

                    var title = document.createElementNS(svgNS, "title");
                    title.textContent = series.name + ': ' + point.value;
                    circle.appendChild(title);

                    svg.appendChild(circle);
                });
            });

            if (data[0] && data[0].data.length > 0) {
                var labels = data[0].labels || data[0].data.map(function(_, i) { return 'P' + (i + 1); });
                labels.forEach(function(label, index) {
                    var x = padding.left + (chartWidth / (labels.length - 1 || 1)) * index;
                    var text = document.createElementNS(svgNS, "text");
                    text.setAttribute("x", x);
                    text.setAttribute("y", height - 5);
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("fill", "rgba(255,255,255,0.3)");
                    text.setAttribute("font-size", "8");
                    text.setAttribute("font-family", "Space Mono, monospace");
                    text.textContent = label;
                    svg.appendChild(text);
                });
            }

            container.innerHTML = '';
            
            var chartDiv = document.createElement('div');
            chartDiv.className = 'line-chart';
            chartDiv.appendChild(svg);

            var legendDiv = document.createElement('div');
            legendDiv.className = 'chart-legend';
            data.forEach(function(series, index) {
                var legendItem = document.createElement('div');
                legendItem.className = 'legend-item';
                
                var dot = document.createElement('div');
                dot.className = 'legend-dot';
                dot.style.backgroundColor = colors[index];
                dot.style.color = colors[index];
                
                var span = document.createElement('span');
                span.textContent = series.name;
                
                legendItem.appendChild(dot);
                legendItem.appendChild(span);
                legendDiv.appendChild(legendItem);
            });

            var wrapper = document.createElement('div');
            wrapper.style.width = '100%';
            wrapper.appendChild(chartDiv);
            wrapper.appendChild(legendDiv);
            container.appendChild(wrapper);
        }

        function loadDashboard() {
            load();
            setInterval(load, 30000);
        }

        async function load() {
            try {
                var sr = await fetch('/api/status', { 
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } 
                });
                var cr = await fetch('/api/dashboard/charts', { 
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } 
                });
                
                var sd = await sr.json(); 
                var s = sd.stats || sd;
                
                document.getElementById('tickets').textContent = s.ticketsAtivos || 0;
                document.getElementById('warns').textContent = s.warns || 0;
                document.getElementById('pendings').textContent = s.pendentes || 0;

                var cd;
                try { 
                    cd = await cr.json(); 
                } catch (e) {
                    cd = { 
                        tickets: { ativos: s.ticketsAtivos||0, fechados:0, historico:[] }, 
                        warns: { hoje:s.warns||0, semana:0, historico:[] }, 
                        pendings: { ativas:s.pendentes||0, concluidas:0, historico:[] }, 
                        activity: { mensagens:0, comandos:0, historico:[] } 
                    };
                }
                
                renderCharts(cd);
            } catch (e) {
                console.error('Error loading data:', e);
                document.getElementById('tickets').textContent = '—';
                document.getElementById('warns').textContent = '—';
                document.getElementById('pendings').textContent = '—';
            }
        }

        function renderCharts(d) {
            var ticketsHistory = d.tickets.historico || [];
            var ticketsData = [
                {
                    name: 'Active',
                    data: ticketsHistory.length > 0 ? ticketsHistory.map(function(h) { return h.ativos || 0; }) : [d.tickets.ativos || 0, Math.max(0, (d.tickets.ativos || 0) - 2)],
                    labels: ticketsHistory.length > 0 ? ticketsHistory.map(function(h) { return h.data || ''; }) : ['Now', 'Prev']
                },
                {
                    name: 'Closed',
                    data: ticketsHistory.length > 0 ? ticketsHistory.map(function(h) { return h.fechados || 0; }) : [d.tickets.fechados || 0, Math.max(0, (d.tickets.fechados || 0) + 1)],
                    labels: ticketsHistory.length > 0 ? ticketsHistory.map(function(h) { return h.data || ''; }) : ['Now', 'Prev']
                }
            ];
            createLineChart('chart-tickets', ticketsData, ['#5865F2', 'rgba(88,101,242,0.3)']);

            var warnsHistory = d.warns.historico || [];
            var warnsData = [
                {
                    name: 'Today',
                    data: warnsHistory.length > 0 ? warnsHistory.map(function(h) { return h.hoje || 0; }) : [d.warns.hoje || 0, Math.max(0, (d.warns.hoje || 0) - 1)],
                    labels: warnsHistory.length > 0 ? warnsHistory.map(function(h) { return h.data || ''; }) : ['Now', 'Prev']
                },
                {
                    name: 'Week',
                    data: warnsHistory.length > 0 ? warnsHistory.map(function(h) { return h.semana || 0; }) : [d.warns.semana || 0, Math.max(0, (d.warns.semana || 0) - 2)],
                    labels: warnsHistory.length > 0 ? warnsHistory.map(function(h) { return h.data || ''; }) : ['Now', 'Prev']
                }
            ];
            createLineChart('chart-warns', warnsData, ['#ff6b6b', 'rgba(255,107,107,0.3)']);

            var pendingsHistory = d.pendings.historico || [];
            var pendingsData = [
                {
                    name: 'Active',
                    data: pendingsHistory.length > 0 ? pendingsHistory.map(function(h) { return h.ativas || 0; }) : [d.pendings.ativas || 0, Math.max(0, (d.pendings.ativas || 0) - 1)],
                    labels: pendingsHistory.length > 0 ? pendingsHistory.map(function(h) { return h.data || ''; }) : ['Now', 'Prev']
                },
                {
                    name: 'Done',
                    data: pendingsHistory.length > 0 ? pendingsHistory.map(function(h) { return h.concluidas || 0; }) : [d.pendings.concluidas || 0, Math.max(0, (d.pendings.concluidas || 0) + 2)],
                    labels: pendingsHistory.length > 0 ? pendingsHistory.map(function(h) { return h.data || ''; }) : ['Now', 'Prev']
                }
            ];
            createLineChart('chart-pendings', pendingsData, ['#ffffff', 'rgba(255,255,255,0.3)']);

            var activityHistory = d.activity.historico || [];
            var activityData = [
                {
                    name: 'Messages',
                    data: activityHistory.length > 0 ? activityHistory.map(function(h) { return h.mensagens || 0; }) : [d.activity.mensagens || 0, Math.max(0, (d.activity.mensagens || 0) - 5)],
                    labels: activityHistory.length > 0 ? activityHistory.map(function(h) { return h.data || ''; }) : ['Now', 'Prev']
                },
                {
                    name: 'Commands',
                    data: activityHistory.length > 0 ? activityHistory.map(function(h) { return h.comandos || 0; }) : [d.activity.comandos || 0, Math.max(0, (d.activity.comandos || 0) - 2)],
                    labels: activityHistory.length > 0 ? activityHistory.map(function(h) { return h.data || ''; }) : ['Now', 'Prev']
                }
            ];
            createLineChart('chart-activity', activityData, ['#5865F2', 'rgba(88,101,242,0.3)']);
        }

        window.logout = function() { 
            localStorage.clear(); 
            window.location.href = '/'; 
        };

        window.addEventListener('resize', function() {
            load();
        });

        // ===== INICIAR ANIMAÇÃO DE LOADING =====
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('loading-canvas');
            const welcomeElement = document.getElementById('welcome-text');
            
            if (canvas && welcomeElement) {
                const animation = new SpiralAnimation(canvas, welcomeElement);
                animation.start();
            }
        });
    </script>
</body>
</html>
